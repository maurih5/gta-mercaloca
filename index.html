<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GTA MERCALOCA</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#e8b53a; --grove:#3a9b47; --ink:#08080a; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--ink);overflow:hidden;font-family:"Press Start 2P",monospace;color:#fff}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  canvas{image-rendering:pixelated;background:#000;max-width:100vw;max-height:100vh;
         box-shadow:0 0 0 2px #000, 0 12px 60px rgba(0,0,0,.9)}
  .screen{position:fixed;inset:0;display:none;place-items:center;background:#000}
  .screen.on{display:grid}
  .bg{position:absolute;inset:0;background-size:cover;background-position:center}
  .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.9) 100%)}
  .scan{position:absolute;inset:0;pointer-events:none;
        background:repeating-linear-gradient(to bottom,rgba(0,0,0,.20) 0 1px,transparent 1px 3px)}

  #load .bar{position:absolute;right:4vw;bottom:6vh;width:42vw;height:16px;border:3px solid #fff;background:#000;padding:2px}
  #load .fill{height:100%;width:0%;background:linear-gradient(90deg,#e8b53a,#fff);transition:width .25s}
  #load .tip{position:absolute;right:4vw;bottom:calc(6vh + 34px);width:54vw;text-align:right;font-size:11px;line-height:1.9;text-shadow:2px 2px 0 #000}
  #load .logo{position:absolute;left:4vw;bottom:6vh;font-size:min(7vw,52px);line-height:1.15;text-shadow:5px 5px 0 #000;letter-spacing:2px}
  #load .logo b{display:block;color:var(--gold);text-shadow:5px 5px 0 #000,0 0 26px rgba(232,181,58,.55)}

  #menu .panel{position:relative;text-align:center;padding:24px}
  #menu h1{font-size:min(9.5vw,68px);color:var(--gold);letter-spacing:4px;
           text-shadow:6px 6px 0 #000,0 0 40px rgba(232,181,58,.45)}
  #menu h2{font-size:min(2.6vw,15px);margin-top:12px;color:#ddd;text-shadow:3px 3px 0 #000}
  #menu .mi{margin-top:30px;font-size:15px;color:#eee;text-shadow:3px 3px 0 #000;cursor:pointer;transition:.1s}
  #menu .mi:hover,#menu .mi.sel{color:var(--grove);transform:scale(1.06)}
  #menu .hint{margin-top:28px;font-size:9px;color:#8e8e8e;line-height:2.2}

  #sel .grid{position:relative;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:94vw}
  #sel .card{width:152px;border:3px solid #2a2a2a;background:#101010;cursor:pointer;transition:.13s;
             box-shadow:0 8px 20px rgba(0,0,0,.7)}
  #sel .card img{width:100%;height:176px;object-fit:cover;object-position:center top;display:block;filter:saturate(1.1)}
  #sel .card .nm{font-size:9px;padding:9px 4px;text-align:center;letter-spacing:1px}
  #sel .card:hover,#sel .card.sel{border-color:var(--gold);transform:translateY(-8px);
             box-shadow:0 14px 28px rgba(0,0,0,.8),0 0 24px rgba(232,181,58,.35)}
  #sel .card.sel .nm{color:var(--gold)}
  #sel h3{position:absolute;top:6vh;font-size:min(4vw,24px);color:var(--gold);text-shadow:4px 4px 0 #000;letter-spacing:3px}
  #sel .go{position:absolute;bottom:6vh;font-size:11px;color:#999;letter-spacing:1px}
  .fade{position:fixed;inset:0;background:#000;pointer-events:none;opacity:0;transition:opacity .35s;z-index:50}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<div class="screen on" id="load">
  <div class="bg" style="background-image:url('img/loading.jpeg')"></div>
  <div class="vig"></div><div class="scan"></div>
  <div class="logo">GRAND THEFT<b>MERCALOCA</b></div>
  <div class="tip" id="tip"></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
</div>

<div class="screen" id="menu">
  <div class="bg" style="background-image:url('img/crew.jpeg')"></div>
  <div class="vig"></div><div class="scan"></div>
  <div class="panel">
    <h1>MERCALOCA</h1>
    <h2>SAN ANDREAS &mdash; GROVE ST. 4 LIFE</h2>
    <div class="mi sel" id="btnPlay">&gt; EMPEZAR PARTIDA</div>
    <div class="hint">WASD / FLECHAS mover &nbsp;&middot;&nbsp; ESPACIO disparar &nbsp;&middot;&nbsp; E auto<br>
      SHIFT correr &nbsp;&middot;&nbsp; P pausa<br>si te frenan con la yuta encima, vas preso</div>
  </div>
</div>

<div class="screen" id="sel">
  <div class="bg" style="background-image:url('img/crew.jpeg');filter:blur(7px) brightness(.3)"></div>
  <h3>ELEGI TU PERSONAJE</h3>
  <div class="grid" id="cards"></div>
  <div class="go">ENTER para jugar &middot; flechas para elegir</div>
</div>
<div class="fade" id="fade"></div>

<script>
/* =========================================================================
   GTA MERCALOCA
   Render: 480x270 interno, upscale nearest.
   - suelo/veredas/decals horneados a un canvas de mundo (coste 0 por frame)
   - edificios en falso 3D: extrusion relativa a la camara + caras sombreadas
   - ciclo dia/noche con lightmap (faroles, faros, fogonazos, ventanas)
   ========================================================================= */

const CREW = [
  {id:'p1', name:'EL SMOKE',  img:'img/p1.jpeg', crop:[0.42,0.11,0.25,0.29], shirt:'#3f9a4a', pants:'#232323'},
  {id:'p2', name:'ACADEMIA',  img:'img/p2.jpeg', crop:[0.40,0.08,0.19,0.14], shirt:'#1d1d22', pants:'#2a2a33'},
  {id:'p3', name:'PALMERA',   img:'img/p3.jpeg', crop:[0.37,0.03,0.20,0.14], shirt:'#26262c', pants:'#3a3f4a'},
  {id:'p4', name:'EL JEFE',   img:'img/p4.jpeg', crop:[0.42,0.17,0.25,0.24], shirt:'#4a4238', pants:'#1c1c1c'},
  {id:'p5', name:'LA PIEDRA', img:'img/p5.jpeg', crop:[0.56,0.16,0.22,0.20], shirt:'#e8e8e0', pants:'#242424'},
];
const TIPS = [
  'Consejo: Manten la calma y apunta con precision. Cada disparo cuenta.',
  'Consejo: Robar un auto sube tu nivel de busqueda. Perdelos en los callejones.',
  'Consejo: Los fajos verdes son guita. Juntalos antes que la yuta.',
  'Consejo: De noche los faros te delatan, pero sin luz no ves un pomo.',
  'Consejo: Si la yuta te encajona el auto, acelera. Si frenas, preso.',
  'Consejo: El barrio es de Mercaloca. Que no te lo saquen.',
];

// ------------------------------------------------------------------ utils
const TAU = Math.PI*2;
const rnd = (a,b) => a + Math.random()*(b-a);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a + (b-a)*t;
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const px = Math.round;
// PRNG deterministico: mismo edificio => mismas ventanas siempre
function hash(n){ n = (n<<13)^n; return 1 - ((n*(n*n*15731+789221)+1376312589) & 0x7fffffff)/1073741824; }
function shade(hex, f){
  const n = parseInt(hex.slice(1),16);
  const r = clamp(((n>>16)&255)*f,0,255)|0, g = clamp(((n>>8)&255)*f,0,255)|0, b = clamp((n&255)*f,0,255)|0;
  return 'rgb('+r+','+g+','+b+')';
}
function mix(c1,c2,t){
  const a=parseInt(c1.slice(1),16), b=parseInt(c2.slice(1),16);
  const r=lerp((a>>16)&255,(b>>16)&255,t)|0, g=lerp((a>>8)&255,(b>>8)&255,t)|0, u=lerp(a&255,b&255,t)|0;
  return 'rgb('+r+','+g+','+u+')';
}

// ------------------------------------------------------------------ mundo
const RW = 480, RH = 270;
const CELL = 190, ROAD = 56, SIDEWALK = 10;
const GRID = 18, WORLD = CELL*GRID;
const FOCAL = 300;                      // menor = mas perspectiva en la extrusion

const buildings = [], props = [], lamps = [];
const lights = [];                       // semaforos, uno por bocacalle
const LIGHT_CYCLE = 11, GREEN = 4.6, AMBER = 0.9;  // por eje: 4.6s verde, 0.9 amarillo, resto rojo
// tipos: paredes, techo y que detalles lleva. Da variedad sin tocar el render.
const BTYPE = [
  {k:'casa',   cols:['#b08a62','#c49a6c','#9e7b58','#caa77c'], roof:'#8c4a35', detail:'tejas'},
  {k:'casa',   cols:['#a8b0a0','#c2c8b8','#93a08e','#d2d6c6'], roof:'#6d7a6a', detail:'tejas'},
  {k:'local',  cols:['#c8c2b0','#d8d2be','#b0aa98','#e2dcc8'], roof:'#8e8878', detail:'ac'},
  {k:'local',  cols:['#8fb0c4','#a6c4d6','#7a99ac','#bcd6e4'], roof:'#6a8494', detail:'ac'},
  {k:'torre',  cols:['#6e7686','#7e8696','#5e6676','#8e96a6'], roof:'#4a5260', detail:'helipuerto'},
  {k:'torre',  cols:['#5a6a72','#6a7a82','#4a5a62','#7a8a92'], roof:'#3e4a50', detail:'helipuerto'},
  {k:'galpon', cols:['#8a7460','#9a8470','#7a6450','#aa9480'], roof:'#6b5a48', detail:'tanque'},
  {k:'ladri',  cols:['#a05a48','#b06a54','#8e4c3c','#c07a60'], roof:'#7a4436', detail:'tanque'},
];

function buildCity(){
  let id = 0;
  for(let cy=0; cy<GRID; cy++) for(let cx=0; cx<GRID; cx++){
    const bx = cx*CELL + ROAD, by = cy*CELL + ROAD;
    const inner = CELL - ROAD;
    const park = (cx+cy)%9 === 4;
    if(park){ props.push({t:'park', x:bx, y:by, w:inner, h:inner}); continue; }
    const downtown = Math.abs(cx-GRID/2) + Math.abs(cy-GRID/2) < 5;
    const cols = downtown ? (Math.random()<.6?1:2) : 1 + ((Math.random()*2)|0);
    const rows = downtown ? (Math.random()<.6?1:2) : 1 + ((Math.random()*2)|0);
    const gap = 7, w = (inner-gap*(cols-1))/cols, h = (inner-gap*(rows-1))/rows;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      if(Math.random() < .12) continue;
      const H = downtown ? rnd(52, 104) : rnd(14, 38);
      const pool = downtown ? BTYPE.filter(t=>t.k==='torre'||t.k==='local')
                            : BTYPE.filter(t=>t.k!=='torre');
      const ty = pool[(cx*5 + cy*3 + r*2 + c) % pool.length];
      const b = {
        id: id++, x: bx + c*(w+gap) + 4, y: by + r*(h+gap) + 4,
        w: w-8, h: h-8, H, ty,
        col: ty.cols[(cx*3 + cy*7 + r + c*2) % ty.cols.length],
        roofCol: ty.roof,
        ac: Math.random()<.6, tank: H>40 && Math.random()<.5,
      };
      // puerta en el lado que da a la calle mas cercana, con un felpudo afuera
      const side = ((cx*3 + cy*5 + r + c) % 4);
      if(side === 0)      b.door = {x: b.x + b.w*0.5, y: b.y,          ox: 0,  oy:-7, s:'n'};
      else if(side === 1) b.door = {x: b.x + b.w*0.5, y: b.y + b.h,    ox: 0,  oy: 7, s:'s'};
      else if(side === 2) b.door = {x: b.x,           y: b.y + b.h*.5, ox:-7,  oy: 0, s:'w'};
      else                b.door = {x: b.x + b.w,     y: b.y + b.h*.5, ox: 7,  oy: 0, s:'e'};
      buildings.push(b);
    }
    // arbolitos y bancos en la vereda del bloque
    for(let i=0;i<2;i++)
      props.push({t:'palm', x: bx + rnd(4, inner-4), y: by + (Math.random()<.5 ? -SIDEWALK/2 : inner+SIDEWALK/2), s: rnd(.85,1.25)});
  }
  // faroles en cada esquina
  for(let cy=0; cy<GRID; cy++) for(let cx=0; cx<GRID; cx++){
    lamps.push({x: cx*CELL + ROAD - 5, y: cy*CELL + ROAD - 5});
  }
  // semaforos: uno por bocacalle. La fase alterna en damero para que las
  // avenidas contiguas no esten todas en verde al mismo tiempo.
  for(let cy=0; cy<GRID; cy++) for(let cx=0; cx<GRID; cx++){
    lights.push({
      cx, cy,
      x: cx*CELL + ROAD/2, y: cy*CELL + ROAD/2,     // centro de la bocacalle
      phase: ((cx+cy) % 2) * (LIGHT_CYCLE/2) + ((cx*7+cy*3) % 5),  // desfasaje
    });
  }
}
const onRoad = (x,y) => (x % CELL) < ROAD || (y % CELL) < ROAD;
/* Estado de un semaforo para un eje dado.
   Devuelve 'verde' | 'amarillo' | 'rojo'. Los dos ejes nunca estan en verde a la vez:
   el ciclo es [H verde][H amarillo][V verde][V amarillo]. */
function lightState(L, horiz){
  const t = ((G.t + L.phase) % LIGHT_CYCLE + LIGHT_CYCLE) % LIGHT_CYCLE;
  const half = LIGHT_CYCLE/2;
  const mine = horiz ? t : (t + half) % LIGHT_CYCLE;   // el eje V va media vuelta despues
  if(mine < GREEN) return 'verde';
  if(mine < GREEN + AMBER) return 'amarillo';
  return 'rojo';
}
// semaforo de la bocacalle a la que se acerca un auto en (x,y) con angulo ang
function lightAhead(x, y, ang){
  const horiz = Math.abs(Math.cos(ang)) > 0.5;
  // celda de la bocacalle hacia la que avanza
  const gx = horiz ? Math.round((x + Math.cos(ang)*CELL*0.5) / CELL) : Math.round(x / CELL);
  const gy = horiz ? Math.round(y / CELL) : Math.round((y + Math.sin(ang)*CELL*0.5) / CELL);
  if(gx < 0 || gy < 0 || gx >= GRID || gy >= GRID) return null;
  const L = lights[gy*GRID + gx];
  if(!L) return null;
  // distancia hasta la LINEA DE PARE (borde de la bocacalle, no el centro)
  const stopX = L.x - Math.cos(ang)*(ROAD/2 + 3);
  const stopY = L.y - Math.sin(ang)*(ROAD/2 + 3);
  const fwd = (stopX - x)*Math.cos(ang) + (stopY - y)*Math.sin(ang);
  return {L, horiz, fwd, stopX, stopY};
}
function hitBuilding(x,y,r){
  for(const b of buildings)
    if(x+r > b.x && x-r < b.x+b.w && y+r > b.y && y-r < b.y+b.h) return b;
  return null;
}
function freeRoadSpot(){
  for(let i=0;i<400;i++){
    const x = rnd(ROAD, WORLD-ROAD), y = rnd(ROAD, WORLD-ROAD);
    if(onRoad(x,y) && !hitBuilding(x,y,10)) return {x,y};
  }
  return {x: ROAD/2, y: ROAD/2};
}
/* Spot en un anillo alrededor del jugador: adentro del radio de simulacion pero
   fuera de la pantalla, asi nada aparece ni desaparece a la vista. */
const SIM_R = 560;                       // radio de simulacion
const PED_TARGET = 58, CAR_TARGET = 46;  // poblacion viva alrededor del jugador
const OFFSCREEN = 300;                   // mas alla de esto ya no se ve
function ringSpot(near, far, needRoad){
  for(let i=0;i<120;i++){
    const a = rnd(0,TAU), d = rnd(near,far);
    const x = clamp(near*0 + G.player.x + Math.cos(a)*d, 12, WORLD-12);
    const y = clamp(G.player.y + Math.sin(a)*d, 12, WORLD-12);
    if(needRoad && !onRoad(x,y)) continue;
    if(hitBuilding(x,y,10)) continue;
    return {x,y};
  }
  return null;
}
// la vereda es la franja entre el borde de la calle y el interior de la manzana
function inPark(x, y){
  for(const pk of props)
    if(pk.t === 'park' && x > pk.x && x < pk.x+pk.w && y > pk.y && y < pk.y+pk.h) return true;
  return false;
}
// un peaton esta bloqueado por un edificio o por el borde del mapa
const MARGIN = 8;
function pedBlocked(x, y, r){
  if(x < MARGIN || y < MARGIN || x > WORLD-MARGIN || y > WORLD-MARGIN) return true;
  return !!hitBuilding(x, y, r);
}
function onSidewalk(x, y){
  if(inPark(x, y)) return true;                // la plaza es zona de peatones
  const ox = ((x % CELL)+CELL)%CELL, oy = ((y % CELL)+CELL)%CELL;
  const inX = ox >= ROAD - 2 && ox <= ROAD + SIDEWALK + 2;
  const inY = oy >= ROAD - 2 && oy <= ROAD + SIDEWALK + 2;
  const farX = ox >= CELL - SIDEWALK - 2, farY = oy >= CELL - SIDEWALK - 2;
  return inX || inY || farX || farY;
}
// empuja hacia la vereda mas cercana (usado cuando un peaton pisa el asfalto)
function toSidewalk(x, y){
  const ox = ((x % CELL)+CELL)%CELL, oy = ((y % CELL)+CELL)%CELL;
  const bx = x - ox, by = y - oy;
  const tX = ox < CELL/2 ? ROAD + SIDEWALK*0.5 : CELL - SIDEWALK*0.5;
  const tY = oy < CELL/2 ? ROAD + SIDEWALK*0.5 : CELL - SIDEWALK*0.5;
  // elige el eje mas cercano para no cruzar toda la manzana
  return Math.abs(ox - tX) < Math.abs(oy - tY) ? {x: bx + tX, y} : {x, y: by + tY};
}
// carril: centro de la calle mas cercana, corrido medio ancho segun el sentido
function laneSnap(x, y, ang){
  const horiz = Math.abs(Math.cos(ang)) > 0.5;
  const LANE = ROAD*0.24;
  if(horiz){
    const cy2 = Math.round((y - ROAD/2)/CELL)*CELL + ROAD/2;
    return {x, y: cy2 + (Math.cos(ang) > 0 ? LANE : -LANE), ang: Math.cos(ang) > 0 ? 0 : Math.PI};
  }
  const cx2 = Math.round((x - ROAD/2)/CELL)*CELL + ROAD/2;
  return {x: cx2 + (Math.sin(ang) > 0 ? -LANE : LANE), y, ang: Math.sin(ang) > 0 ? Math.PI/2 : -Math.PI/2};
}

// ----------------------------------------------------------- canvas/capas
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
cv.width = RW; cv.height = RH;
ctx.imageSmoothingEnabled = false;
let GROUND = null, GCTX = null, MINI = null, LIGHT = null, LCTX = null, VIG = null;
let EMIT = null, ECTX = null;
const litWindows = [];   // ventanas encendidas de este frame, se suman despues del ambiente

function fit(){
  const s = Math.max(1, Math.min(innerWidth/RW, innerHeight/RH));
  cv.style.width = Math.floor(RW*s) + 'px'; cv.style.height = Math.floor(RH*s) + 'px';
}
addEventListener('resize', fit); fit();

/* Hornea suelo, veredas, lineas, cebras, pasto y sombras: se dibuja una vez
   y despues cada frame es un solo drawImage recortado. */
function bakeGround(){
  GROUND = document.createElement('canvas');
  GROUND.width = GROUND.height = WORLD;
  const g = GCTX = GROUND.getContext('2d');

  g.fillStyle = '#31343a'; g.fillRect(0,0,WORLD,WORLD);                    // asfalto
  // manzanas: vereda + interior
  for(let cy=0; cy<GRID; cy++) for(let cx=0; cx<GRID; cx++){
    const bx = cx*CELL + ROAD - SIDEWALK, by = cy*CELL + ROAD - SIDEWALK;
    const s = CELL - ROAD + SIDEWALK*2;
    g.fillStyle = '#8d8d86'; g.fillRect(bx, by, s, s);                     // vereda
    g.fillStyle = '#7a7a73'; g.fillRect(bx, by, s, 2); g.fillRect(bx, by, 2, s);
    g.fillStyle = '#5a6247'; g.fillRect(bx+SIDEWALK, by+SIDEWALK, s-SIDEWALK*2, s-SIDEWALK*2);
    // juntas de la vereda
    g.fillStyle = 'rgba(0,0,0,.10)';
    for(let i=0;i<s;i+=14){ g.fillRect(bx+i, by, 1, SIDEWALK); g.fillRect(bx+i, by+s-SIDEWALK, 1, SIDEWALK);
                            g.fillRect(bx, by+i, SIDEWALK, 1); g.fillRect(bx+s-SIDEWALK, by+i, SIDEWALK, 1); }
  }
  // parques
  for(const p of props) if(p.t === 'park'){
    g.fillStyle = '#4d6b3a'; g.fillRect(p.x, p.y, p.w, p.h);
    g.fillStyle = '#5c7d45';
    for(let i=0;i<70;i++) g.fillRect(p.x+rnd(0,p.w), p.y+rnd(0,p.h), rnd(3,9), rnd(2,5));
    g.fillStyle = '#9a8a6a';                                               // senderito
    g.fillRect(p.x, p.y+p.h/2-5, p.w, 10); g.fillRect(p.x+p.w/2-5, p.y, 10, p.h);
  }
  // lineas y cebras
  for(let i=0;i<=GRID;i++){
    const rx = i*CELL, ry = i*CELL;
    g.fillStyle = '#c9a227';
    for(let y=0; y<WORLD; y+=16){
      if(onRoad(rx+ROAD/2, y) && (y % CELL) > ROAD) g.fillRect(rx+ROAD/2-1, y, 2, 9);
    }
    for(let x=0; x<WORLD; x+=16){
      if(onRoad(x, ry+ROAD/2) && (x % CELL) > ROAD) g.fillRect(x, ry+ROAD/2-1, 9, 2);
    }
  }
  g.fillStyle = 'rgba(235,235,235,.55)';
  for(let cy=0; cy<=GRID; cy++) for(let cx=0; cx<=GRID; cx++){
    const ix = cx*CELL, iy = cy*CELL;                                       // cebras en cada boca
    for(let k=3; k<ROAD-3; k+=8){
      g.fillRect(ix+k, iy-9, 5, 7);       g.fillRect(ix+k, iy+ROAD+2, 5, 7);
      g.fillRect(ix-9, iy+k, 7, 5);       g.fillRect(ix+ROAD+2, iy+k, 7, 5);
    }
  }
  // sucio del asfalto: parches, tapas de cloaca, grietas
  for(let i=0;i<4200;i++){
    const x = rnd(0,WORLD), y = rnd(0,WORLD);
    if(!onRoad(x,y)) continue;
    g.fillStyle = Math.random()<.5 ? 'rgba(0,0,0,.14)' : 'rgba(255,255,255,.05)';
    g.fillRect(x, y, rnd(4,22), rnd(3,12));
  }
  for(let i=0;i<420;i++){
    const x = rnd(0,WORLD), y = rnd(0,WORLD);
    if(!onRoad(x,y)) continue;
    g.fillStyle = '#26282c'; g.fillRect(x, y, 8, 8);
    g.fillStyle = '#1c1e21'; g.fillRect(x+1, y+1, 6, 6);
  }
  // sombras de los edificios (sol fijo arriba-izq) + de los arboles
  for(const b of buildings){
    const o = b.H*0.30;
    g.fillStyle = 'rgba(0,0,0,.30)';
    g.fillRect(b.x + o*0.55, b.y + o*0.8, b.w, b.h);
  }
  for(const p of props) if(p.t === 'palm'){
    g.fillStyle = 'rgba(0,0,0,.22)';
    g.beginPath(); g.ellipse(p.x+7, p.y+9, 11*p.s, 6*p.s, 0, 0, TAU); g.fill();
  }
  for(const l of lamps){ g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(l.x+2, l.y+3, 4, 10); }

  // minimapa: version chica horneada
  const MS = 320;
  MINI = document.createElement('canvas'); MINI.width = MINI.height = MS;
  const m = MINI.getContext('2d'), k = MS/WORLD;
  m.fillStyle = '#23262b'; m.fillRect(0,0,MS,MS);
  m.fillStyle = '#4a5240';
  for(let cy=0; cy<GRID; cy++) for(let cx=0; cx<GRID; cx++)
    m.fillRect((cx*CELL+ROAD)*k, (cy*CELL+ROAD)*k, (CELL-ROAD)*k, (CELL-ROAD)*k);
  m.fillStyle = '#6c6c62';
  for(const b of buildings) m.fillRect(b.x*k, b.y*k, Math.max(1,b.w*k), Math.max(1,b.h*k));

  // lightmap + vineta
  LIGHT = document.createElement('canvas'); LIGHT.width = RW; LIGHT.height = RH;
  LCTX = LIGHT.getContext('2d');
  EMIT = document.createElement('canvas'); EMIT.width = RW; EMIT.height = RH;
  ECTX = EMIT.getContext('2d');
  VIG = document.createElement('canvas'); VIG.width = RW; VIG.height = RH;
  const vg = VIG.getContext('2d');
  const rg = vg.createRadialGradient(RW/2, RH/2, RH*0.35, RW/2, RH/2, RH*0.95);
  rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,.55)');
  vg.fillStyle = rg; vg.fillRect(0,0,RW,RH);
}

// sprite de resplandor cacheado (para no crear gradientes cada frame)
const glowCache = {};
function glow(r,gg,b,size){
  const k = r+','+gg+','+b+','+size;
  if(glowCache[k]) return glowCache[k];
  const c = document.createElement('canvas'); c.width = c.height = size;
  const x = c.getContext('2d');
  const gr = x.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  gr.addColorStop(0,   'rgba('+r+','+gg+','+b+',1)');
  gr.addColorStop(0.35,'rgba('+r+','+gg+','+b+',.55)');
  gr.addColorStop(1,   'rgba('+r+','+gg+','+b+',0)');
  x.fillStyle = gr; x.fillRect(0,0,size,size);
  return glowCache[k] = c;
}

// ciclo dia/noche (3 min por dia)
const DAY = 240;
// t=0 medianoche, 0.25 amanecer, 0.5 mediodia, 0.75 atardecer
const SKY = [
  [0.00,'#4a5680'],[0.18,'#4e5b86'],[0.24,'#8a6e86'],[0.28,'#e0895f'],
  [0.33,'#ffc98e'],[0.40,'#fff0d2'],[0.50,'#ffffff'],[0.62,'#fff4dd'],
  [0.70,'#ffcb8e'],[0.76,'#f08a55'],[0.82,'#7d5f84'],[0.88,'#525e8a'],[1.00,'#4a5680'],
];
function dayT(){ return (G.t/DAY + 0.34) % 1; }   // arranca de manana
function ambient(){
  const t = dayT();
  for(let i=0;i<SKY.length-1;i++){
    if(t >= SKY[i][0] && t <= SKY[i+1][0])
      return mix(SKY[i][1], SKY[i+1][1], (t-SKY[i][0])/(SKY[i+1][0]-SKY[i][0]));
  }
  return '#ffffff';
}
function darkness(){                      // 1 a medianoche, 0 a mediodia
  return clamp((Math.cos(dayT()*TAU)+1)/2, 0, 1);
}

// puerta mas cercana a (x,y) dentro de un radio; null si no hay
function nearestDoor(x, y, maxD){
  let best = null, bd = maxD;
  for(const b of buildings){
    if(!b.door) continue;
    const dx2 = b.door.x + b.door.ox - x, dy2 = b.door.y + b.door.oy - y;
    const d = Math.hypot(dx2, dy2);
    if(d < bd){ bd = d; best = b; }
  }
  return best;
}
const CARCOL = ['#2f6b3c','#7a1f1f','#1f3f7a','#b4b4bc','#c9a227','#20242b','#6a3f8f','#c85a1e','#1d6b6b'];

// mancha permanente en el suelo (sangre, quemado, frenada)

// -------------------------------------------------------------- arranque
function startGame(def){
  G.player = makePlayer(def);
  const s = freeRoadSpot(); G.player.x = s.x; G.player.y = s.y;
  G.cam.x = clamp(s.x-RW/2, 0, WORLD-RW); G.cam.y = clamp(s.y-RH/2, 0, WORLD-RH);
  G.cars = []; G.peds = []; G.cops = []; G.bullets = []; G.pickups = []; G.fx = []; G.smoke = [];
  for(let i=0;i<CAR_TARGET;i++){
    const sp = ringSpot(60, SIM_R, true) || freeRoadSpot(); G.cars.push(makeCar(sp.x, sp.y));
  }
  for(let i=0;i<PED_TARGET;i++){
    const sp = sidewalkSpot(40, SIM_R) || freeRoadSpot(); G.peds.push(makePedAt(sp.x, sp.y));
  }
  for(let i=0;i<18;i++) G.pickups.push(makePickup());
  G.wanted = 0; G.money = 0; G.state = 'play'; G.paused = false; G.shake = 0;
  G.busted = 0; G.bustT = 0; G.bustFine = 0;
  say('MERCALOCA EN LA CALLE. JUNTA GUITA.', 3.4);
}

// ---------------------------------------------------------------- update
/* ARRESTO
   Si la yuta te alcanza en el auto (o a pie estando muy buscado), en vez de matarte
   te bajan del auto, te esposan y te llevan preso: perdes una parte de la guita y
   el auto, y reaparecas en la comisaria sin estrellas. */
function bust(){
  const P = G.player;
  if(P.dead || G.busted) return;
  G.busted = 1; G.bustT = 0;
  G.bustFine = Math.round(G.money * 0.35) + 200*G.wanted;
  G.bustCar = P.car;
  if(P.car){ exitCar(); }                      // te bajan del auto
  P.hp = Math.max(P.hp, 1);
  G.shake += 6;
  say('QUEDATE QUIETO!', 2.2);
}
function finishBust(){
  const P = G.player;
  G.money = Math.max(0, G.money - G.bustFine);
  G.wanted = 0; G.wantCool = 0;
  G.cops.length = 0;
  G.cars = G.cars.filter(c => !c.chase && !c.cop);
  const s = freeRoadSpot();                    // salis de la comisaria en otro lado
  P.x = s.x; P.y = s.y; P.hp = P.maxhp; P.car = null; P.cool = .5;
  G.cam.x = clamp(P.x-RW/2, 0, WORLD-RW); G.cam.y = clamp(P.y-RH/2, 0, WORLD-RH);
  G.busted = 0; G.bustT = 0;
  say('TE SOLTARON. PERDISTE $' + G.bustFine, 3.4);
}
function update(dt){
  G.t += dt;
  if(G.msgT > 0) G.msgT -= dt;
  G.shake = Math.max(0, G.shake - dt*22);
  G.flash = Math.max(0, G.flash - dt*4);
  const P = G.player; if(!P) return;

  // ---- secuencia de arresto: 3.2s de corte, despues la comisaria
  if(G.busted){
    G.bustT += dt;
    for(const c of G.cops){                    // la yuta se le viene encima
      if(c.hp <= 0) continue;
      const d = dist(c,P);
      c.ang = Math.atan2(P.y-c.y, P.x-c.x);
      if(d > 13){ c.x += Math.cos(c.ang)*46*dt; c.y += Math.sin(c.ang)*46*dt; c.walk += dt*5; }
    }
    for(const f of G.fx){ f.x += f.vx*dt; f.y += f.vy*dt; f.life -= dt; }
    G.fx = G.fx.filter(f => f.life > 0);
    if(G.bustT > 3.2) finishBust();
    return;
  }

  const ix = (keys.KeyD||keys.ArrowRight?1:0) - (keys.KeyA||keys.ArrowLeft?1:0);
  const iy = (keys.KeyS||keys.ArrowDown?1:0) - (keys.KeyW||keys.ArrowUp?1:0);
  P.muzzle = Math.max(0, P.muzzle - dt*14);

  if(P.dead){
    P.hp = 0;
    if(keys.Enter) startGame(P.def);
  } else if(P.car){
    const car = P.car, acc = (keys.ShiftLeft||keys.ShiftRight) ? 200 : 145;
    if(iy < 0) car.spd += acc*dt;
    else if(iy > 0) car.spd -= acc*1.25*dt;
    else car.spd *= (1 - 1.6*dt);
    car.spd = clamp(car.spd, -70, 195);
    const turning = Math.abs(car.spd) > 4 ? ix : 0;
    car.steer = lerp(car.steer, turning, dt*9);
    if(turning) car.ang += turning*2.3*dt*(car.spd>0?1:-1)*clamp(Math.abs(car.spd)/90,.35,1);
    // marca de goma al derrapar
    if(Math.abs(car.spd) > 120 && Math.abs(car.steer) > .55){
      const pxx = Math.cos(car.ang+Math.PI/2)*5, pyy = Math.sin(car.ang+Math.PI/2)*5;
      decal(car.x+pxx, car.y+pyy, 1.6, 'rgba(15,15,18,.32)');
      decal(car.x-pxx, car.y-pyy, 1.6, 'rgba(15,15,18,.32)');
      if(Math.random()<.5) puff(car.x, car.y, '180,180,180', 1, 5);
    }
    const nx = car.x + Math.cos(car.ang)*car.spd*dt, ny = car.y + Math.sin(car.ang)*car.spd*dt;
    if(hitBuilding(nx, ny, 9)){
      const dmg = Math.abs(car.spd)/12;
      if(dmg > 3){ car.hp -= dmg; P.hp -= dmg*.5; boom(car.x,car.y,8,'255,190,90'); G.shake += dmg*.5; }
      car.spd *= -.25;
    } else { car.x = clamp(nx,8,WORLD-8); car.y = clamp(ny,8,WORLD-8); }
    P.x = car.x; P.y = car.y; P.ang = car.ang;
    if(car.hp < 45) puff(car.x - Math.cos(car.ang)*10, car.y - Math.sin(car.ang)*10,
                         car.hp<18 ? '255,140,40' : '90,90,90', 1, 16);
    for(const list of [G.peds, G.cops]) for(const e of list){
      if(Math.abs(car.spd) > 40 && e.hp > 0 && dist(car,e) < 14){
        e.hp -= Math.abs(car.spd)/6; boom(e.x,e.y,10,'170,30,30'); decal(e.x,e.y,rnd(3,6),'rgba(90,12,12,.45)');
        if(e.hp <= 0) wantUp(1);
      }
    }
    if(car.hp <= 0){
      boom(car.x,car.y,34,'255,150,40',2); puff(car.x,car.y,'40,40,40',10,26);
      decal(car.x,car.y,14,'rgba(10,10,10,.5)');
      G.shake += 12; G.flash = .8; P.hp -= 25; exitCar();
    }
    if(keys.KeyE && P.cool <= 0){ exitCar(); P.cool = .4; }
  } else {
    const running = (keys.ShiftLeft||keys.ShiftRight);
    const spd = running ? 94 : 58;
    P.run = lerp(P.run, running?1:0, dt*8);
    const m = Math.hypot(ix,iy) || 1;
    const nx = P.x + ix/m*spd*dt, ny = P.y + iy/m*spd*dt;
    if(!hitBuilding(nx, P.y, P.r)) P.x = clamp(nx,6,WORLD-6);
    if(!hitBuilding(P.x, ny, P.r)) P.y = clamp(ny,6,WORLD-6);
    if(ix||iy){ P.ang = Math.atan2(iy,ix); P.walk += dt*spd/8; }
    if(keys.KeyE && P.cool <= 0){
      P.cool = .4;
      let best = null, bd = 26;
      for(const c of G.cars){ const d = dist(c,P); if(d < bd){ bd = d; best = c; } }
      if(best){ best.ai = false; P.car = best; if(!best.cop) wantUp(1);
                say(best.cop ? 'AUTO DE LA YUTA' : 'AUTO ROBADO'); }
    }
  }
  P.cool -= dt;

  if(keys.Space && !P.dead && P.cool <= 0){
    P.cool = P.car ? .17 : .21;
    const a = P.ang + rnd(-.055,.055);
    G.bullets.push({x:P.x+Math.cos(a)*10, y:P.y+Math.sin(a)*10,
                    vx:Math.cos(a)*430, vy:Math.sin(a)*430, life:.7, mine:true});
    P.muzzle = 1; G.shake += 1.1;
    boom(P.x+Math.cos(a)*11, P.y+Math.sin(a)*11, 3, '255,225,150');
    if(G.wanted < 1) wantUp(1);
  }

  for(const b of G.bullets){
    b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
    if(hitBuilding(b.x,b.y,1)){ b.life = 0; boom(b.x,b.y,4,'220,220,200'); continue; }
    if(b.mine){
      for(const list of [G.cops, G.peds]) for(const e of list){
        if(e.hp > 0 && dist(b,e) < 7){
          e.hp -= 22; b.life = 0; boom(e.x,e.y,7,'190,35,35');
          if(e.hp <= 0){ decal(e.x,e.y,rnd(4,7),'rgba(95,12,12,.5)');
                         wantUp(e.kind==='cop'?2:1); G.money += e.kind==='cop'?120:40; }
        }
      }
    } else if(!P.dead && dist(b,P) < (P.car?12:7)){
      b.life = 0; G.shake += 1.6;
      if(P.car){ P.car.hp -= 7; P.hp -= 2; } else P.hp -= 7;
      boom(P.x,P.y,5,'190,35,35');
    }
  }
  G.bullets = G.bullets.filter(b => b.life > 0);

  for(const p of G.peds){
    if(p.hp <= 0) continue;

    // ---- adentro de un edificio: invisible, sale cuando se le cumple el tiempo
    if(p.inside){
      p.doorT -= dt;
      p.fade = Math.min(1, p.fade + dt*3);
      if(p.doorT <= 0){
        const d = p.inside.door;
        p.x = d.x + d.ox; p.y = d.y + d.oy;
        p.ang = Math.atan2(d.oy, d.ox);            // sale mirando a la calle
        p.inside = null; p.fade = 0; p.doorT = rnd(12,40); p.target = null;
      }
      continue;
    }
    p.fade = Math.min(1, p.fade + dt*2.6);         // aparece de a poco al salir

    p.tt -= dt;
    // ---- buscar puerta cada tanto y entrar
    const busy = (G.wanted > 0 && dist(p,P) < 105);
    if(!busy){
      p.doorT -= dt;
      if(p.doorT <= 0 && !p.target){
        const b = nearestDoor(p.x, p.y, 110);
        if(b) p.target = b; else p.doorT = rnd(4,10);
      }
      if(p.target){
        const d = p.target.door, tx2 = d.x + d.ox, ty2 = d.y + d.oy;
        const dd = Math.hypot(tx2-p.x, ty2-p.y);
        if(dd < 5){                                 // llego: entra
          p.inside = p.target; p.target = null;
          p.fade = 0; p.doorT = rnd(5,22);
          continue;
        }
        p.ang = Math.atan2(ty2-p.y, tx2-p.x);       // camina derecho a la puerta
        const sp2 = p.sped;
        const nx2 = p.x + Math.cos(p.ang)*sp2*dt, ny2 = p.y + Math.sin(p.ang)*sp2*dt;
        if(!pedBlocked(nx2, ny2, 3)){ p.x = nx2; p.y = ny2; p.walk += dt*sp2/8; p.stuck = 0; }
        else {
          p.stuck = (p.stuck || 0) + dt;                 // no llega: desiste y sigue su camino
          if(p.stuck > .5){ p.target = null; p.doorT = rnd(5,14); p.stuck = 0; p.ang += Math.PI/2; }
        }
        continue;
      }
    } else { p.target = null; }
    // en la vereda caminan derecho; al llegar a una esquina deciden doblar o cruzar
    if(p.tt <= 0){
      p.tt = rnd(1.6,4.2);
      const turn = Math.random();
      if(turn < .42) p.ang += Math.PI/2;
      else if(turn < .84) p.ang -= Math.PI/2;
      else p.ang += Math.PI;
      p.ang = Math.round(p.ang/(Math.PI/2))*(Math.PI/2);
    }
    // corren si hay quilombo cerca: tiros, patrulleros o un auto encima
    const dp = dist(p,P);
    const scared = (G.wanted > 0 && dp < 105) || (P.car && Math.abs(P.car.spd) > 70 && dp < 65);
    if(scared){ p.ang = Math.atan2(p.y-P.y, p.x-P.x); p.chat = 0; }
    const s = scared ? 78*p.ty.panic : p.sped;
    const stepX = Math.cos(p.ang)*s*dt, stepY = Math.sin(p.ang)*s*dt;
    const nx = p.x + stepX, ny = p.y + stepY;

    // esquiva autos que vienen
    let dodge = false;
    for(const c of G.cars){
      if(Math.abs(c.spd) < 25) continue;
      if(Math.hypot(c.x-nx, c.y-ny) < 22){ p.ang = Math.atan2(ny-c.y, nx-c.x); dodge = true; break; }
    }

    if(!dodge){
      /* Deslizamiento por ejes: si el diagonal choca, prueba cada eje por separado.
         Asi al rozar una pared sigue caminando en paralelo en vez de frenar en seco. */
      const freeX = !pedBlocked(nx, p.y, p.r), freeY = !pedBlocked(p.x, ny, p.r);
      if(freeX){ p.x = nx; }
      if(freeY){ p.y = ny; }

      if(freeX || freeY){
        p.walk += dt*s/8;
        p.stuck = 0;
        // si deslizo contra una pared, alinea el rumbo al eje que quedo libre
        if(!freeX || !freeY) p.ang = Math.atan2(freeY ? Math.sign(stepY) : 0,
                                                freeX ? Math.sign(stepX) : 0);
        if(!scared && !onSidewalk(p.x, p.y)){
          const t = toSidewalk(p.x, p.y);
          if(!pedBlocked(t.x, t.y, 5)){ p.x = lerp(p.x, t.x, dt*4.5); p.y = lerp(p.y, t.y, dt*4.5); }
        }
      } else {
        /* Encerrado en las dos direcciones (esquina o borde del mapa).
           Prueba las 4 cardinales y toma la primera libre; si ninguna sirve,
           lo saca del cuerpo del edificio para que no quede vibrando. */
        p.stuck = (p.stuck || 0) + dt;
        /* Barrido completo de 8 direcciones a distancias crecientes.
           Sondear solo 3 angulos dejaba casos sin salida (esquinas concavas,
           vertices del mapa) y el peaton vibraba en el lugar. */
        let out = false;
        for(const reach of [s*dt + p.r + 1, p.r*2.5, p.r*5]){
          for(let i=0;i<8 && !out;i++){
            const base = p.ang + (i%2 ? -1 : 1) * Math.ceil(i/2) * Math.PI/4;
            const tx2 = p.x + Math.cos(base)*reach, ty2 = p.y + Math.sin(base)*reach;
            if(!pedBlocked(tx2, ty2, p.r)){
              p.ang = base; p.tt = rnd(.8,1.8); out = true;
              p.x += Math.cos(base)*Math.min(reach, s*dt*1.5);   // se despega ya mismo
              p.y += Math.sin(base)*Math.min(reach, s*dt*1.5);
            }
          }
          if(out) break;
        }
        // sin salida en ninguna direccion: reubicar en la vereda mas cercana
        if(!out && p.stuck > 0.45){
          const esc = toSidewalk(p.x, p.y);
          if(!pedBlocked(esc.x, esc.y, p.r)){ p.x = esc.x; p.y = esc.y; }
          else {
            const sp3 = sidewalkSpot(120, SIM_R*0.9);
            if(sp3){ p.x = sp3.x; p.y = sp3.y; }
            else { p.x = clamp(p.x, MARGIN+2, WORLD-MARGIN-2);   // al menos sacarlo del borde
                   p.y = clamp(p.y, MARGIN+2, WORLD-MARGIN-2); }
          }
          p.stuck = 0; p.target = null; p.ang = rnd(0,TAU);
        }
      }
    }
    // separacion simple: se corren si estan encima de otro
    for(const q of G.peds){
      if(q === p || q.hp <= 0) continue;
      const dx2 = p.x-q.x, dy2 = p.y-q.y, d2 = dx2*dx2 + dy2*dy2;
      if(d2 > 0.01 && d2 < 64){
        const d3 = Math.sqrt(d2), push = (8-d3)*dt*2.2;
        const sx2 = p.x + dx2/d3*push, sy2 = p.y + dy2/d3*push;
        if(!pedBlocked(sx2, sy2, p.r)){ p.x = sx2; p.y = sy2; }   // no empujar adentro de una pared
      }
    }
    // charlar: si hay otro peaton al lado, frenan un rato
    if(!scared && p.chat <= 0 && Math.random() < .25*dt){
      for(const q of G.peds){
        if(q !== p && q.hp > 0 && dist(p,q) < 16){ p.chat = rnd(1.5,4); q.chat = p.chat; break; }
      }
    }
    if(p.chat > 0){ p.chat -= dt; p.walk += dt*2; p.x -= Math.cos(p.ang)*s*dt; p.y -= Math.sin(p.ang)*s*dt; }
  }
  // poblacion por streaming: mantener PED_TARGET vivos cerca, soltar los lejanos
  G.peds = G.peds.filter(q => (q.hp > 0 && dist(q,P) < SIM_R*1.12) || (q.hp <= 0 && dist(q,P) < 300));
  const alive = G.peds.filter(q => q.hp > 0).length;
  if(alive < PED_TARGET){
    G.pedSpawn = (G.pedSpawn || 0) + dt;
    if(G.pedSpawn > 0.12){
      G.pedSpawn = 0;
      const sp = sidewalkSpot(OFFSCREEN, SIM_R*0.95);
      if(sp) G.peds.push(makePedAt(sp.x, sp.y));
    }
  } else G.pedSpawn = 0;

  for(const c of G.cars){
    if(!c.ai || c.chase || c.hp <= 0) continue;
    c.horn = Math.max(0, c.horn - dt);
    // frenar por el de adelante, por el jugador a pie o por un auto cruzado
    const fwx = Math.cos(c.ang), fwy = Math.sin(c.ang);
    const ahead = c.w*0.6 + 9 + Math.abs(c.spd)*0.22;
    // proyecta cada candidato sobre mi eje: solo frena por lo que esta ADELANTE,
    // en mi mismo sentido y dentro del ancho de mi carril.
    const inFront = (ox2, oy2, halfW) => {
      const rx2 = ox2 - c.x, ry2 = oy2 - c.y;
      const fwd = rx2*fwx + ry2*fwy;                 // distancia longitudinal
      const lat = Math.abs(-rx2*fwy + ry2*fwx);      // desvio lateral
      return fwd > 0 && fwd < ahead && lat < halfW;
    };
    let block = false, queued = false;
    for(const o of G.cars){
      if(o === c || o.hp <= 0) continue;
      const sameWay = (Math.cos(c.ang)*Math.cos(o.ang) + Math.sin(c.ang)*Math.sin(o.ang)) > 0.3;
      if(!sameWay) continue;                         // el que viene de frente va por su carril
      if(inFront(o.x, o.y, (c.h+o.h)*0.42)){
        block = true;
        // si el de adelante espera el semaforo, yo tambien: es cola, no traba
        if((o.waitLight || 0) > 0 || o.queued) queued = true;
        break;
      }
    }
    c.queued = queued;
    if(!block && !P.dead){
      const pw = P.car ? (c.h+P.car.h)*0.45 : c.h*0.5;
      if(inFront(P.x, P.y, pw)){
        block = true;
        if(!P.car && c.horn <= 0 && Math.random() < .5) c.horn = 1.1;   // bocinazo
      }
    }
    // ---- semaforo
    let redStop = false;
    const LA = lightAhead(c.x, c.y, c.ang);
    if(LA && LA.fwd > -2 && LA.fwd < 46){
      const st = lightState(LA.L, LA.horiz);
      // en amarillo frena solo si llega a parar; si ya esta encima, pasa
      if(st === 'rojo' || (st === 'amarillo' && LA.fwd > Math.abs(c.spd)*0.42)) redStop = true;
    }
    if(redStop){
      const brake = LA.fwd < 3 ? 6 : 3.0;
      c.spd += (0 - c.spd)*brake*dt;
      if(LA.fwd < 1.5 && c.spd < 6) c.spd = 0;     // clavado en la linea de pare
      c.waitLight = (c.waitLight || 0) + dt;
      c.stopT = 0;                                 // esperar el rojo NO cuenta como trabado
    } else if(block){
      c.spd += (0 - c.spd)*3.4*dt;
      c.waitLight = 0;
      if(queued) c.stopT = 0;                        // hacer cola en rojo no es estar trabado
      else c.stopT += dt;
    }
    else { c.spd += (c.cruise - c.spd)*0.75*dt; c.stopT = 0; c.waitLight = 0; }
    // destrabe: si lleva mucho parado y tiene lugar, dobla y sigue
    if(c.stopT > 3.5){
      const R2 = c.h*0.5 + 1;
      for(const turn of [Math.PI/2, -Math.PI/2]){
        const L2 = laneSnap(c.x, c.y, c.ang + turn);
        const ax = L2.x + Math.cos(L2.ang)*20, ay = L2.y + Math.sin(L2.ang)*20;
        if(!hitBuilding(ax, ay, R2) && ax > 10 && ay > 10 && ax < WORLD-10 && ay < WORLD-10){
          c.x = L2.x; c.y = L2.y; c.ang = L2.ang;
          c.spd = Math.max(16, c.cruise*0.35); c.turned = true; break;
        }
      }
      c.stopT = 0;
    }

    const CR = c.h*0.5 + 1;                        // radio real del auto (antes fijo en 9)
    const carBlocked = (x2,y2) => hitBuilding(x2,y2,CR) ||
      x2 < 10 || y2 < 10 || x2 > WORLD-10 || y2 > WORLD-10;
    const nx = c.x+Math.cos(c.ang)*c.spd*dt, ny = c.y+Math.sin(c.ang)*c.spd*dt;
    if(carBlocked(nx, ny)){
      /* Antes giraba 90 grados a ciegas y hacia laneSnap: si el carril nuevo daba
         contra la misma pared volvia a chocar al frame siguiente y se reseteaba a
         spd=12 para siempre. Ahora prueba los dos giros y la media vuelta, y se
         queda con el primero que tenga camino libre de verdad. */
      const probe = Math.max(c.w, 18);
      let fixed = false;
      const opts = Math.random() < .5 ? [Math.PI/2, -Math.PI/2, Math.PI]
                                      : [-Math.PI/2, Math.PI/2, Math.PI];
      for(const turn of opts){
        const na = c.ang + turn;
        const L = laneSnap(c.x, c.y, na);
        if(!carBlocked(L.x + Math.cos(L.ang)*probe, L.y + Math.sin(L.ang)*probe)
           && !carBlocked(L.x, L.y)){
          c.x = L.x; c.y = L.y; c.ang = L.ang;
          c.spd = Math.max(16, c.cruise*0.35); c.turned = true; fixed = true; break;
        }
      }
      if(!fixed){                                  // cajon sin salida: se lo recicla
        if(dist(c,P) > OFFSCREEN) c.hp = 0;
        else { c.ang += Math.PI; const L = laneSnap(c.x, c.y, c.ang);
               c.x = L.x; c.y = L.y; c.ang = L.ang; c.spd = 16; }
      }
    } else { c.x = nx; c.y = ny; }

    // en cada bocacalle decide si dobla, y se re-encarrila
    const ox = ((c.x % CELL)+CELL)%CELL, oy = ((c.y % CELL)+CELL)%CELL;
    const atCross = ox < ROAD && oy < ROAD;
    if(atCross && !c.turned){
      c.turned = true;
      if(Math.random() < .34){
        c.ang += (Math.random()<.5 ? Math.PI/2 : -Math.PI/2);
        const L = laneSnap(c.x, c.y, c.ang); c.x = L.x; c.y = L.y; c.ang = L.ang;
      }
    } else if(!atCross){
      c.turned = false;
      const L = laneSnap(c.x, c.y, c.ang);                        // correccion suave de carril
      if(Math.abs(Math.cos(c.ang)) > .5) c.y = lerp(c.y, L.y, dt*3);
      else c.x = lerp(c.x, L.x, dt*3);
    }
    // si quedo trabado mucho tiempo, se lo saca de encima
    if(c.stopT > 9 && dist(c,P) > OFFSCREEN) c.hp = 0;
  }
  G.cars = G.cars.filter(c => c.hp > 0 || c === P.car);
  // se limpia con el MISMO radio con el que se cuenta, si no se acumulan en la banda
  G.cars = G.cars.filter(c => c === P.car || dist(c,P) < SIM_R*1.12);
  const carsNear = G.cars.filter(c => c.ai && c.hp > 0).length;
  if(carsNear < CAR_TARGET){
    G.carSpawn = (G.carSpawn || 0) + dt;
    if(G.carSpawn > 0.22){                          // ritmo acotado, no 60 spawns por segundo
      G.carSpawn = 0;
      const sp = ringSpot(OFFSCREEN, SIM_R*0.95, true);
      if(sp) G.cars.push(makeCar(sp.x, sp.y));
    }
  } else G.carSpawn = 0;

  const wantCops = [0,2,4,6,9,12][G.wanted] || 0;
  if(G.cops.filter(c=>c.hp>0).length < wantCops && Math.random() < 1.6*dt) G.cops.push(makeCop());

  // ---- patrulleros: aparecen con 2+ estrellas, mas cuantas mas tengas
  const wantChase = [0,0,1,2,3,5][G.wanted] || 0;
  const chasers = G.cars.filter(c => c.chase && c.hp > 0);
  if(chasers.length < wantChase && Math.random() < 0.9*dt) G.cars.push(makeChaser());
  for(const c of chasers){
    const d = dist(c,P);
    const want = Math.atan2(P.y-c.y, P.x-c.x);
    let diff = ((want - c.ang + Math.PI*3) % TAU) - Math.PI;
    // no dobla en seco: gira limitado por la velocidad, como cualquier auto
    const rate = 2.6 * clamp(Math.abs(c.spd)/70, .3, 1);
    const turn = clamp(diff, -rate*dt, rate*dt);
    c.ang += turn;
    c.steer = lerp(c.steer, clamp(diff, -1, 1), dt*8);
    // acelera si esta lejos, frena si ya lo tiene al lado
    const target = d > 70 ? c.cruise : (d > 26 ? 70 : 26);
    c.spd += (target - c.spd) * 1.5 * dt;
    const CR2 = c.h*0.5 + 1;
    const nx2 = c.x + Math.cos(c.ang)*c.spd*dt, ny2 = c.y + Math.sin(c.ang)*c.spd*dt;
    if(hitBuilding(nx2, ny2, CR2) || nx2<10 || ny2<10 || nx2>WORLD-10 || ny2>WORLD-10){
      // rodea el obstaculo en vez de clavarse contra el
      let got = false;
      for(const t2 of [0.7, -0.7, 1.5, -1.5]){
        const a2 = c.ang + t2;
        const tx3 = c.x + Math.cos(a2)*(Math.abs(c.spd)*dt + CR2 + 6);
        const ty3 = c.y + Math.sin(a2)*(Math.abs(c.spd)*dt + CR2 + 6);
        if(!hitBuilding(tx3, ty3, CR2) && tx3>10 && ty3>10 && tx3<WORLD-10 && ty3<WORLD-10){
          c.ang = a2; got = true; break;
        }
      }
      c.spd *= got ? .8 : .35;
      if(!got && d > OFFSCREEN) c.hp = 0;              // no llega nunca: se recicla
    } else { c.x = nx2; c.y = ny2; }

    // ---- encajonar: si te alcanzan y vas lento, te bajan del auto
    if(!P.dead && !G.busted && P.car && d < 24){
      if(Math.abs(P.car.spd) < 34){ c.bustT = (c.bustT||0) + dt; if(c.bustT > 0.8) bust(); }
      else {
        c.bustT = 0;                                   // te embisten para frenarte
        if(d < 17){
          const push = Math.atan2(P.y-c.y, P.x-c.x);
          P.car.spd *= .93;
          P.car.x += Math.cos(push)*26*dt; P.car.y += Math.sin(push)*26*dt;
          P.car.hp -= 7*dt; G.shake += 22*dt;
        }
      }
    } else c.bustT = 0;
  }
  // el patrullero vacio deja de perseguir si te alejas demasiado
  G.cars = G.cars.filter(c => !c.chase || (c.hp > 0 && dist(c,P) < SIM_R*1.3));
  for(const c of G.cops){
    if(c.hp <= 0) continue;
    c.muzzle = Math.max(0, c.muzzle - dt*14);
    const d = dist(c,P);
    c.ang = Math.atan2(P.y-c.y, P.x-c.x);
    if(d > 34){
      const s = 52 + G.wanted*6;
      const nx = c.x+Math.cos(c.ang)*s*dt, ny = c.y+Math.sin(c.ang)*s*dt;
      if(!hitBuilding(nx,c.y,c.r)) c.x = nx;
      if(!hitBuilding(c.x,ny,c.r)) c.y = ny;
      c.walk += dt*s/8;
    }
    // ---- arresto a pie: si te toca y estas quieto o casi, te esposa
    if(!P.dead && !G.busted && d < 15){
      const slow = P.car ? Math.abs(P.car.spd) < 26 : true;
      if(slow){ c.bustT += dt; if(c.bustT > 0.65) bust(); }
      else c.bustT = 0;
    } else c.bustT = 0;

    c.cool -= dt;
    if(d < 155 && c.cool <= 0 && !P.dead){
      c.cool = rnd(.7,1.6)/(1+G.wanted*.15);
      const a = c.ang + rnd(-.16,.16);
      c.muzzle = 1;
      G.bullets.push({x:c.x+Math.cos(a)*9, y:c.y+Math.sin(a)*9,
                      vx:Math.cos(a)*335, vy:Math.sin(a)*335, life:.8, mine:false});
    }
  }
  G.cops = G.cops.filter(c => c.hp > 0 && dist(c,P) < 700);

  if(G.wanted > 0){
    G.wantCool += dt;
    if(G.cops.some(c => dist(c,P) < 195)) G.wantCool = 0;
    if(G.wantCool > 12){ G.wantCool = 0; G.wanted--; say(G.wanted ? 'BAJO LA BUSQUEDA' : 'LOS PERDISTE'); }
  }

  for(const pk of G.pickups){
    pk.t += dt;
    if(dist(pk,P) < 12){
      if(pk.kind === 'cash'){ const v = 150 + ((Math.random()*8)|0)*50; G.money += v; say('+$'+v); }
      else { P.hp = Math.min(P.maxhp, P.hp+35); say('+35 VIDA'); }
      boom(pk.x, pk.y, 8, pk.kind==='cash' ? '120,220,120' : '230,90,90');
      Object.assign(pk, makePickup());
    }
  }

  for(const f of G.fx){ f.x += f.vx*dt; f.y += f.vy*dt; f.vx *= .93; f.vy *= .93; f.life -= dt; }
  G.fx = G.fx.filter(f => f.life > 0);
  for(const s of G.smoke){ s.x += s.vx*dt; s.y += s.vy*dt; s.vy *= .96; s.r += dt*7; s.life -= dt; }
  G.smoke = G.smoke.filter(s => s.life > 0);

  if(P.hp <= 0 && !P.dead){
    P.dead = true; P.hp = 0; exitCar();
    boom(P.x,P.y,32,'170,30,30'); decal(P.x,P.y,9,'rgba(95,12,12,.55)');
    G.shake += 10;
  }

  // camara con suavizado + adelanto en la direccion de marcha
  const lead = P.car ? clamp(P.car.spd/195,0,1)*52 : 0;
  const tx = clamp(P.x + Math.cos(P.ang)*lead - RW/2, 0, WORLD-RW);
  const ty = clamp(P.y + Math.sin(P.ang)*lead - RH/2, 0, WORLD-RH);
  G.cam.x = lerp(G.cam.x, tx, clamp(dt*7,0,1));
  G.cam.y = lerp(G.cam.y, ty, clamp(dt*7,0,1));
}
function exitCar(){
  const P = G.player; if(!P.car) return;
  P.car.ai = true; P.car.spd = 0;
  P.x = P.car.x + Math.cos(P.car.ang+Math.PI/2)*15;
  P.y = P.car.y + Math.sin(P.car.ang+Math.PI/2)*15;
  P.car = null;
}
function wantUp(n){
  const old = G.wanted;
  G.wanted = Math.min(5, G.wanted+n); G.wantCool = 0;
  if(G.wanted > old && G.wanted >= 2) say('NIVEL DE BUSQUEDA ' + '*'.repeat(G.wanted));
}

/* =======================================================================
   DIBUJO
   ======================================================================= */
function quad(x1,y1,x2,y2,x3,y3,x4,y4,col){
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.lineTo(x4,y4);
  ctx.closePath(); ctx.fill();
}

function drawGround(){
  ctx.drawImage(GROUND, px(G.cam.x), px(G.cam.y), RW, RH, 0, 0, RW, RH);
}

/* Edificio en falso 3D: el techo se corre segun cuan lejos del centro de
   pantalla esta, asi las torres "se abren" hacia los bordes. */
function drawBuilding(b, night){
  const x = b.x - G.cam.x, y = b.y - G.cam.y;
  const cxp = x + b.w/2 - RW/2, cyp = y + b.h/2 - RH/2;
  const dx = cxp * b.H / FOCAL, dy = cyp * b.H / FOCAL;
  const rx = x + dx, ry = y + dy;                       // techo
  const dark = shade(b.col, .45), wallE = shade(b.col, .62), wallW = shade(b.col, .80);
  const wallN = shade(b.col, .70), wallS = shade(b.col, .55);

  ctx.fillStyle = dark; ctx.fillRect(px(x), px(y), px(b.w), px(b.h));   // planta baja
  // 4 paredes (juntas tapan exactamente el prisma)
  quad(x,      y,      x+b.w,      y,      rx+b.w, ry,      rx,      ry,      dy<0?wallN:shade(b.col,.34));
  quad(x,      y+b.h,  x+b.w,      y+b.h,  rx+b.w, ry+b.h,  rx,      ry+b.h,  dy>0?wallS:shade(b.col,.34));
  quad(x,      y,      x,          y+b.h,  rx,     ry+b.h,  rx,      ry,      dx<0?wallW:shade(b.col,.34));
  quad(x+b.w,  y,      x+b.w,      y+b.h,  rx+b.w, ry+b.h,  rx+b.w,  ry,      dx>0?wallE:shade(b.col,.34));

  // ventanas sobre las 2 paredes que miran a camara
  const rows = Math.max(1, Math.floor(b.H/11));
  const lit = night > .28;
  const drawWall = (ax,ay,bx2,by2,axis) => {
    const cols = Math.max(1, Math.floor(Math.hypot(bx2-ax, by2-ay)/13));
    for(let r=0;r<rows;r++){
      const t0 = (r+0.28)/rows, t1 = (r+0.72)/rows;
      for(let c=0;c<cols;c++){
        const u0 = (c+0.25)/cols, u1 = (c+0.75)/cols;
        const on = lit && hash(b.id*97 + r*13 + c*7 + axis*3) > 0.15;
        const X0 = lerp(ax,bx2,u0), Y0 = lerp(ay,by2,u0);
        const X1 = lerp(ax,bx2,u1), Y1 = lerp(ay,by2,u1);
        const P0 = [X0+dx*t0, Y0+dy*t0], P1 = [X1+dx*t0, Y1+dy*t0];
        const P2 = [X1+dx*t1, Y1+dy*t1], P3 = [X0+dx*t1, Y0+dy*t1];
        ctx.fillStyle = on ? 'rgba(90,72,40,.95)' : 'rgba(16,18,24,.55)';
        ctx.beginPath(); ctx.moveTo(P0[0],P0[1]); ctx.lineTo(P1[0],P1[1]);
        ctx.lineTo(P2[0],P2[1]); ctx.lineTo(P3[0],P3[1]); ctx.closePath(); ctx.fill();
        if(on) litWindows.push([P0,P1,P2,P3]);
      }
    }
  };
  if(dy > 2) drawWall(x, y+b.h, x+b.w, y+b.h, 1); else if(dy < -2) drawWall(x, y, x+b.w, y, 2);
  if(dx > 2) drawWall(x+b.w, y, x+b.w, y+b.h, 3); else if(dx < -2) drawWall(x, y, x, y+b.h, 4);

  // ---- techo
  const rc = b.roofCol, det = b.ty.detail;
  ctx.fillStyle = rc; ctx.fillRect(px(rx), px(ry), px(b.w), px(b.h));
  if(det === 'tejas'){                                   // techo a dos aguas
    ctx.fillStyle = shade(rc, 1.18);
    ctx.fillRect(px(rx), px(ry), px(b.w), px(b.h/2));
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    for(let ly = ry+2; ly < ry+b.h-1; ly += 3) ctx.fillRect(px(rx), px(ly), px(b.w), 1);
    ctx.fillStyle = shade(rc, 1.45);                     // cumbrera
    ctx.fillRect(px(rx), px(ry+b.h/2-1), px(b.w), 2);
    ctx.fillStyle = '#4a4a4a';                           // chimenea
    ctx.fillRect(px(rx+b.w*.7), px(ry+b.h*.28), 5, 5);
  } else {
    ctx.fillStyle = 'rgba(0,0,0,.14)';                   // membrana manchada
    for(let i=0;i<4;i++){
      const hx = hash(b.id*31+i)*.5+.5, hy = hash(b.id*57+i)*.5+.5;
      ctx.fillRect(px(rx+hx*b.w*.7), px(ry+hy*b.h*.7), 7+i*2, 5+i);
    }
    ctx.fillStyle = shade(rc, 1.35);                     // parapeto
    ctx.fillRect(px(rx), px(ry), px(b.w), 2.5); ctx.fillRect(px(rx), px(ry), 2.5, px(b.h));
    ctx.fillStyle = shade(rc, .70);
    ctx.fillRect(px(rx), px(ry+b.h-2.5), px(b.w), 2.5); ctx.fillRect(px(rx+b.w-2.5), px(ry), 2.5, px(b.h));
    ctx.fillStyle = shade(rc, .82);                      // caja de escalera
    ctx.fillRect(px(rx+b.w*.12), px(ry+b.h*.62), 10, 8);
    ctx.fillStyle = shade(rc, 1.25); ctx.fillRect(px(rx+b.w*.12), px(ry+b.h*.62), 10, 2.5);
  }
  if(det === 'ac' || b.ac){                              // equipos de aire
    for(let i=0;i<2;i++){
      const ax2 = rx + b.w*(.22+i*.3), ay2 = ry + b.h*.2;
      ctx.fillStyle = '#6e7278'; ctx.fillRect(px(ax2), px(ay2), 9, 7);
      ctx.fillStyle = '#9aa0a6'; ctx.fillRect(px(ax2), px(ay2), 9, 2.4);
      ctx.fillStyle = '#4a4e52'; ctx.fillRect(px(ax2+2), px(ay2+3), 5, 3);
    }
  }
  if(det === 'tanque' || b.tank){                        // tanque de agua
    ctx.fillStyle = '#5f5346'; ctx.fillRect(px(rx+b.w*.58), px(ry+b.h*.52), 12, 10);
    ctx.fillStyle = '#8a7a63'; ctx.fillRect(px(rx+b.w*.58), px(ry+b.h*.52), 12, 3.2);
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(px(rx+b.w*.58), px(ry+b.h*.52+7), 12, 3);
  }
  if(det === 'helipuerto' && b.w > 34 && b.h > 34){      // H de helipuerto
    const cxh = rx+b.w/2, cyh = ry+b.h/2;
    ctx.strokeStyle = 'rgba(240,240,240,.7)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(cxh, cyh, Math.min(b.w,b.h)*.28, 0, TAU); ctx.stroke();
    ctx.fillStyle = 'rgba(240,240,240,.8)';
    const hw = Math.min(b.w,b.h)*.16;
    ctx.fillRect(px(cxh-hw), px(cyh-hw*.8), 2.5, hw*1.6);
    ctx.fillRect(px(cxh+hw-2.5), px(cyh-hw*.8), 2.5, hw*1.6);
    ctx.fillRect(px(cxh-hw), px(cyh-1), hw*2, 2);
  }
  // ---- puerta a nivel de calle
  if(b.door){
    const d = b.door, dxp = d.x - G.cam.x, dyp = d.y - G.cam.y;
    ctx.fillStyle = '#2e2620';
    if(d.s === 'n' || d.s === 's') ctx.fillRect(px(dxp-4), px(dyp-1.5), 8, 3);
    else                           ctx.fillRect(px(dxp-1.5), px(dyp-4), 3, 8);
    ctx.fillStyle = shade(b.col, 1.3);                 // marco
    if(d.s === 'n' || d.s === 's') ctx.fillRect(px(dxp-5), px(dyp-2), 10, 1);
    else                           ctx.fillRect(px(dxp-2), px(dyp-5), 1, 10);
    ctx.fillStyle = 'rgba(70,60,50,.55)';              // felpudo
    ctx.fillRect(px(dxp + d.ox*0.45 - 3), px(dyp + d.oy*0.45 - 2), 6, 4);
  }
  if(b.H > 45){ const bl = Math.sin(G.t*3.4) > 0;        // baliza
    ctx.fillStyle = bl ? '#ff5a5a' : '#4a1212';
    ctx.fillRect(px(rx+b.w*.85), px(ry+b.h*.85), 3, 3); }
}

function drawPalm(p){
  const x = p.x - G.cam.x, y = p.y - G.cam.y;
  if(x < -24 || y < -30 || x > RW+24 || y > RH+24) return;
  const H = 26*p.s;
  const dx = (x - RW/2)*H/FOCAL, dy = (y - RH/2)*H/FOCAL;
  ctx.strokeStyle = '#6b5636'; ctx.lineWidth = 3*p.s;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+dx, y+dy); ctx.stroke();
  const tx = x+dx, ty = y+dy, sw = Math.sin(G.t*1.2 + p.x*.1)*1.5;
  for(let i=0;i<7;i++){
    const a = i/7*TAU + sw*.1;
    ctx.strokeStyle = i%2 ? '#2f6b34' : '#3d8a3f'; ctx.lineWidth = 2.4*p.s;
    ctx.beginPath(); ctx.moveTo(tx, ty);
    ctx.quadraticCurveTo(tx+Math.cos(a)*7*p.s, ty+Math.sin(a)*7*p.s - 2,
                         tx+Math.cos(a)*12*p.s + sw, ty+Math.sin(a)*12*p.s + 3);
    ctx.stroke();
  }
  ctx.fillStyle = '#4a3a22'; ctx.fillRect(px(tx-2), px(ty-2), 4, 4);
}

function drawTrafficLight(L){
  const x = L.x - G.cam.x, y = L.y - G.cam.y;
  if(x < -ROAD-30 || y < -ROAD-30 || x > RW+ROAD+30 || y > RH+ROAD+30) return;
  const H = 19, off = ROAD/2 + 4;
  // 4 cabezales, uno mirando a cada boca de la esquina
  const heads = [
    {dx:-off, dy:-off, horiz:true },   // el que ve el que viene por la horizontal
    {dx: off, dy: off, horiz:true },
    {dx: off, dy:-off, horiz:false},
    {dx:-off, dy: off, horiz:false},
  ];
  for(const h of heads){
    const bx = x + h.dx, by = y + h.dy;
    if(bx < -20 || by < -20 || bx > RW+20 || by > RH+20) continue;
    const ex = (bx-RW/2)*H/FOCAL, ey = (by-RH/2)*H/FOCAL;
    ctx.strokeStyle = '#2b2e33'; ctx.lineWidth = 2;                 // poste
    ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx+ex, by+ey); ctx.stroke();
    const hx = bx+ex, hy = by+ey;
    ctx.fillStyle = '#16181c'; ctx.fillRect(px(hx-2.5), px(hy-6), 5, 11);   // caja
    const st = lightState(L, h.horiz);
    const on = {rojo:'#ff3a2a', amarillo:'#ffc21a', verde:'#39d94a'};
    for(const [i,k] of ['rojo','amarillo','verde'].entries()){
      ctx.fillStyle = st === k ? on[k] : 'rgba(20,20,20,.9)';
      ctx.fillRect(px(hx-1.5), px(hy-4.6+i*3.2), 3, 2.6);
    }
  }
}
function drawLamp(l, night){
  const x = l.x - G.cam.x, y = l.y - G.cam.y;
  if(x < -20 || y < -24 || x > RW+20 || y > RH+20) return;
  const H = 22, dx = (x-RW/2)*H/FOCAL, dy = (y-RH/2)*H/FOCAL;
  ctx.strokeStyle = '#3a3d44'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x+dx, y+dy); ctx.stroke();
  ctx.fillStyle = night > .3 ? '#ffe08a' : '#9aa0a8';
  ctx.fillRect(px(x+dx-3), px(y+dy-2), 6, 4);
}

function drawGuy(e, faceKey, shirt, pants, hurt){
  const x = e.x - G.cam.x, y = e.y - G.cam.y;
  if(x < -24 || y < -26 || x > RW+24 || y > RH+24) return;
  const s = Math.sin(e.walk||0), c = Math.cos(e.walk||0);
  const fx = Math.cos(e.ang), fy = Math.sin(e.ang);          // adelante
  const rxp = -fy, ryp = fx;                                 // perpendicular
  const bob = Math.abs(s)*0.9;

  ctx.fillStyle = 'rgba(0,0,0,.34)';
  ctx.beginPath(); ctx.ellipse(x+1.5, y+5.5, 6.5, 3.4, 0, 0, TAU); ctx.fill();

  // piernas: una adelante y otra atras segun el ciclo
  ctx.fillStyle = pants;
  for(const sg of [1,-1]){
    const sw = s*sg*2.6;
    ctx.fillRect(px(x + rxp*sg*2.2 + fx*sw - 1.5), px(y + ryp*sg*2.2 + fy*sw + 0.5), 3, 4);
  }
  // torso orientado
  ctx.save(); ctx.translate(x, y - 2 - bob); ctx.rotate(e.ang);
  ctx.fillStyle = shade(shirt, .78); ctx.fillRect(-4, -4.2, 8.5, 8.5);
  ctx.fillStyle = shirt;             ctx.fillRect(-4, -4.2, 6.8, 8.5);
  ctx.fillStyle = 'rgba(255,255,255,.13)'; ctx.fillRect(-4, -4.2, 6.8, 2);
  ctx.fillStyle = '#c49a72';                                  // brazos
  ctx.fillRect(2, -5.5, 3, 2.6); ctx.fillRect(2, 3, 3, 2.6);
  ctx.fillStyle = '#16181c'; ctx.fillRect(4.5, -1.2, 6, 2.4);  // fierro
  ctx.restore();

  const f = G.faces[faceKey] || G.faces.ped;
  const hy = y - 11 - bob;
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(px(x-6.5), px(hy-0.5), 13, 13);
  if(f) ctx.drawImage(f, px(x-6), px(hy), 12, 12);
  else { ctx.fillStyle = '#c9a07a'; ctx.fillRect(px(x-4), px(hy+1), 8, 8); }
  if(hurt){ ctx.fillStyle = 'rgba(190,20,20,.35)'; ctx.fillRect(px(x-6), px(hy), 12, 12); }
  // fogonazo
  if(e.muzzle > 0){
    ctx.globalAlpha = e.muzzle;
    ctx.fillStyle = '#fff2b0';
    ctx.beginPath();
    ctx.moveTo(x+fx*11, y+fy*11);
    ctx.lineTo(x+fx*17+rxp*3.5, y+fy*17+ryp*3.5);
    ctx.lineTo(x+fx*17-rxp*3.5, y+fy*17-ryp*3.5);
    ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
  }
}

function drawCar(c, night){
  const x = c.x - G.cam.x, y = c.y - G.cam.y;
  if(x < -40 || y < -40 || x > RW+40 || y > RH+40) return;
  const H = 11, dx = (x-RW/2)*H/FOCAL, dy = (y-RH/2)*H/FOCAL;
  const w = c.w, h = c.h;

  ctx.fillStyle = 'rgba(0,0,0,.36)';                         // sombra
  ctx.save(); ctx.translate(x+3, y+4); ctx.rotate(c.ang); ctx.fillRect(-w/2, -h/2, w, h); ctx.restore();

  ctx.save(); ctx.translate(x, y); ctx.rotate(c.ang);
  ctx.fillStyle = '#131418';                                  // ruedas
  const st = c.steer*0.5;
  for(const [wx,wy,rot] of [[w*.28,-h/2,st],[w*.28,h/2-3,st],[-w*.3,-h/2,0],[-w*.3,h/2-3,0]]){
    ctx.save(); ctx.translate(wx, wy+1.5); ctx.rotate(rot); ctx.fillRect(-3.5,-1.8,7,3.6); ctx.restore();
  }
  ctx.fillStyle = shade(c.col,.55); ctx.fillRect(-w/2, -h/2, w, h);      // chasis
  ctx.restore();

  ctx.save(); ctx.translate(x+dx, y+dy); ctx.rotate(c.ang);              // carroceria elevada
  ctx.fillStyle = c.col;
  ctx.fillRect(-w/2+1, -h/2+1, w-2, h-2);
  ctx.fillStyle = shade(c.col,1.22); ctx.fillRect(-w/2+1, -h/2+1, w-2, 2.4);   // brillo capot
  ctx.fillStyle = shade(c.col,.72);  ctx.fillRect(-w/2+1, h/2-3.4, w-2, 2.4);
  ctx.fillStyle = shade(c.col,.88);  ctx.fillRect(-w/2+3, -h/2+2, w*.42, h-4); // techo
  ctx.fillStyle = 'rgba(30,45,60,.85)';                                        // vidrios
  ctx.fillRect(w*.04, -h/2+2.4, 5, h-4.8);
  ctx.fillRect(-w/2+2.5, -h/2+2.4, 4, h-4.8);
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(w*.04, -h/2+2.4, 5, 1.6);
  ctx.fillStyle = '#1a1c20'; ctx.fillRect(w/2-2.2, -h/2+1, 1.6, h-2);          // paragolpes
  ctx.fillStyle = night > .3 ? '#fff6cc' : '#d8d4bb';                          // faros
  ctx.fillRect(w/2-2.4, -h/2+2.5, 2, 3); ctx.fillRect(w/2-2.4, h/2-5.5, 2, 3);
  ctx.fillStyle = c.spd < -2 ? '#ff7a6a' : '#8c2a22';                          // stops
  ctx.fillRect(-w/2+0.6, -h/2+2.5, 1.6, 3); ctx.fillRect(-w/2+0.6, h/2-5.5, 1.6, 3);
  if(c.cop){
    const bl = Math.floor(G.t*7)%2;
    ctx.fillStyle = '#0d0f13'; ctx.fillRect(-2.5, -h/2+2.5, 5, h-5);
    ctx.fillStyle = bl ? '#4a86ff' : '#2a2f5a'; ctx.fillRect(-2.5, -h/2+2.5, 5, (h-5)/2);
    ctx.fillStyle = bl ? '#3a1f2a' : '#ff4a4a'; ctx.fillRect(-2.5, 0, 5, (h-5)/2);
  }
  ctx.restore();
}

/* Iluminacion en 2 pasadas:
     1) AMB  -> multiply : tine la escena con el color de la hora (oscurece de noche)
     2) EMIT -> lighter  : suma faroles, faros, ventanas y fogonazos ENCIMA del multiply,
                           asi una luz sigue brillando aunque sea medianoche. */
function drawLights(night){
  LCTX.globalCompositeOperation = 'source-over';
  LCTX.fillStyle = ambient(); LCTX.fillRect(0,0,RW,RH);
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(LIGHT, 0, 0);
  ctx.globalCompositeOperation = 'source-over';

  // ---- emisivos
  ECTX.globalCompositeOperation = 'source-over';
  ECTX.clearRect(0,0,RW,RH);
  ECTX.globalCompositeOperation = 'lighter';
  const k = clamp(night*1.15, 0, 1);
  let any = false;

  if(night > .18){
    ECTX.fillStyle = 'rgba(255,214,140,.85)';          // ventanas encendidas
    for(const w of litWindows){
      ECTX.beginPath(); ECTX.moveTo(w[0][0],w[0][1]); ECTX.lineTo(w[1][0],w[1][1]);
      ECTX.lineTo(w[2][0],w[2][1]); ECTX.lineTo(w[3][0],w[3][1]); ECTX.closePath(); ECTX.fill();
      any = true;
    }
    for(const l of lamps){                              // faroles
      const x = l.x-G.cam.x, y = l.y-G.cam.y;
      if(x < -60 || y < -60 || x > RW+60 || y > RH+60) continue;
      const gsz = 92;
      ECTX.globalAlpha = .75*k; ECTX.drawImage(glow(255,205,120,gsz), x-gsz/2, y-gsz/2+8);
      ECTX.globalAlpha = 1;
      ECTX.fillStyle = '#fff1c4';
      ECTX.fillRect(px(x-3), px(y-18*22/FOCAL-2), 6, 4);
      any = true;
    }
    for(const L of lights){                             // semaforos brillan de noche
      const x = L.x - G.cam.x, y = L.y - G.cam.y;
      if(x < -ROAD-40 || y < -ROAD-40 || x > RW+ROAD+40 || y > RH+ROAD+40) continue;
      const off = ROAD/2 + 4, H = 19;
      for(const h of [{dx:-off,dy:-off,hz:true},{dx:off,dy:off,hz:true},
                      {dx:off,dy:-off,hz:false},{dx:-off,dy:off,hz:false}]){
        const bx = x+h.dx, by = y+h.dy;
        if(bx < -16 || by < -16 || bx > RW+16 || by > RH+16) continue;
        const st = lightState(L, h.hz), gsz = 22;
        const c2 = st === 'rojo' ? [255,60,45] : st === 'amarillo' ? [255,195,30] : [60,220,80];
        ECTX.globalAlpha = .75*k;
        ECTX.drawImage(glow(c2[0],c2[1],c2[2],gsz),
                       bx + (bx-RW/2)*H/FOCAL - gsz/2, by + (by-RH/2)*H/FOCAL - gsz/2);
      }
      ECTX.globalAlpha = 1; any = true;
    }
    for(const c of G.cars){                             // conos de faros
      const x = c.x-G.cam.x, y = c.y-G.cam.y;
      if(x < -90 || y < -90 || x > RW+90 || y > RH+90) continue;
      ECTX.save(); ECTX.translate(x, y); ECTX.rotate(c.ang);
      const lg = ECTX.createLinearGradient(0,0,72,0);
      lg.addColorStop(0,'rgba(255,244,196,'+(.55*k)+')');
      lg.addColorStop(1,'rgba(255,244,196,0)');
      ECTX.fillStyle = lg;
      ECTX.beginPath(); ECTX.moveTo(11,-5); ECTX.lineTo(72,-26); ECTX.lineTo(72,26); ECTX.lineTo(11,5);
      ECTX.closePath(); ECTX.fill(); ECTX.restore();
      any = true;
    }
  }
  for(const c of G.cars) if(c.cop){                     // balizas: se ven siempre
    const x = c.x-G.cam.x, y = c.y-G.cam.y;
    if(x < -60 || y < -60 || x > RW+60 || y > RH+60) continue;
    const bl = Math.floor(G.t*7)%2, gsz = 74;
    ECTX.globalAlpha = .85;
    ECTX.drawImage(glow(bl?80:255, bl?140:60, bl?255:60, gsz), x-gsz/2, y-gsz/2);
    ECTX.globalAlpha = 1; any = true;
  }
  const P = G.player;
  if(P && P.muzzle > 0){ const gsz = 108;
    ECTX.globalAlpha = P.muzzle;
    ECTX.drawImage(glow(255,228,158,gsz), P.x-G.cam.x-gsz/2, P.y-G.cam.y-gsz/2); any = true; }
  for(const c of G.cops) if(c.muzzle > 0){ const gsz = 74;
    ECTX.globalAlpha = c.muzzle*.85;
    ECTX.drawImage(glow(255,228,158,gsz), c.x-G.cam.x-gsz/2, c.y-G.cam.y-gsz/2); any = true; }
  for(const f of G.fx) if(f.col === '255,150,40' || f.col === '255,190,90'){ const gsz = 50;
    ECTX.globalAlpha = clamp(f.life/f.max,0,1)*.85;
    ECTX.drawImage(glow(255,170,70,gsz), f.x-G.cam.x-gsz/2, f.y-G.cam.y-gsz/2); any = true; }
  for(const pk of G.pickups){                            // los items laten
    const x = pk.x-G.cam.x, y = pk.y-G.cam.y;
    if(x<-40||y<-40||x>RW+40||y>RH+40) continue;
    const gsz = 38;
    ECTX.globalAlpha = (.30+Math.sin(pk.t*3)*.14)*Math.max(k,.5);
    ECTX.drawImage(pk.kind==='cash' ? glow(110,255,120,gsz) : glow(255,110,110,gsz), x-gsz/2, y-gsz/2);
    any = true;
  }
  ECTX.globalAlpha = 1;
  if(any){
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(EMIT, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
  }
}

function drawRadar(){
  const S = 58, ox = 7, oy = RH-S-7, MS = 320, k = MS/WORLD;
  const P = G.player, half = S/2;
  ctx.fillStyle = '#000'; ctx.fillRect(ox-2, oy-2, S+4, S+4);
  ctx.drawImage(MINI, clamp(P.x*k-half, 0, MS-S), clamp(P.y*k-half, 0, MS-S), S, S, ox, oy, S, S);
  const sx = clamp(P.x*k-half, 0, MS-S), sy = clamp(P.y*k-half, 0, MS-S);
  const dot = (e,col,sz=2) => {
    const x = ox + (e.x*k - sx), y = oy + (e.y*k - sy);
    if(x<ox||y<oy||x>ox+S-1||y>oy+S-1) return;
    ctx.fillStyle = col; ctx.fillRect(px(x), px(y), sz, sz);
  };
  for(const pk of G.pickups) dot(pk, pk.kind==='cash' ? '#5ad25a' : '#ff5a5a');
  for(const c of G.cops) dot(c, '#4aa3ff');
  for(const c of G.cars) if(c.chase && c.hp > 0) dot(c, '#2a6aff', 3);
  ctx.fillStyle = '#fff'; ctx.fillRect(px(ox + (P.x*k-sx))-1, px(oy + (P.y*k-sy))-1, 3, 3);
  ctx.strokeStyle = '#d8d8d8'; ctx.lineWidth = 1; ctx.strokeRect(ox-1.5, oy-1.5, S+3, S+3);
  ctx.strokeStyle = '#000'; ctx.strokeRect(ox-2.5, oy-2.5, S+5, S+5);
}

function text(t,x,y,col='#fff',size=8,align='left'){
  ctx.font = size+'px "Press Start 2P", monospace';
  ctx.textAlign = align;
  ctx.fillStyle = 'rgba(0,0,0,.85)'; ctx.fillText(t, x+1, y+1); ctx.fillText(t, x+2, y+2);
  ctx.fillStyle = col; ctx.fillText(t, x, y);
}

function drawHUD(){
  const P = G.player;
  ctx.fillStyle = 'rgba(0,0,0,.42)';
  ctx.fillRect(0, 0, 118, 32); ctx.fillRect(RW-96, 0, 96, 45);
  text('$'+G.money, RW-7, 13, '#7de07d', 9, 'right');
  for(let i=0;i<5;i++)
    text('*', RW-9-i*11, 28, i < G.wanted ? '#ffd34a' : '#35383d', 11, 'right');
  ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(RW-79, 34, 72, 7);
  const hp = clamp(P.hp/P.maxhp, 0, 1);
  ctx.fillStyle = hp > .3 ? '#d1483f' : '#ff6a5a'; ctx.fillRect(RW-78, 35, 70*hp, 5);
  ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(RW-78, 35, 70*hp, 1);
  text(P.def.name, 7, 13, '#ffd34a', 8);
  const h = Math.floor(dayT()*24), mm = Math.floor((dayT()*24%1)*60);
  text(String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0'), 7, 26, '#cfcfcf', 7);
  if(G.msgT > 0){
    ctx.globalAlpha = clamp(G.msgT, 0, 1);
    text(G.msg, RW/2, RH-16, '#fff', 8, 'center'); ctx.globalAlpha = 1;
  }
  if(G.busted){
    const k = clamp(0.45 + G.bustT/0.35, 0, 1);   // arranca ya legible
    const bl = Math.floor(G.t*6)%2;                     // azul y rojo, como la baliza
    ctx.fillStyle = bl ? 'rgba(18,34,105,.5)' : 'rgba(105,18,26,.5)';
    ctx.fillRect(0,0,RW,RH);
    // banda opaca detras del texto: sin esto el tinte se lo come
    ctx.fillStyle = 'rgba(0,0,0,.93)';
    ctx.fillRect(0, RH/2-32, RW, 74);
    ctx.fillStyle = bl ? '#3a5ad8' : '#d83a44';
    ctx.fillRect(0, RH/2-33, RW, 2); ctx.fillRect(0, RH/2+42, RW, 2);
    ctx.globalAlpha = k;
    text('TE AGARRARON', RW/2, RH/2-8, '#ff8a7a', 16, 'center');
    text('MULTA: $' + G.bustFine, RW/2, RH/2+14, '#ffd34a', 9, 'center');
    if(G.bustT > 1.4) text('TE LLEVAN A LA COMISARIA', RW/2, RH/2+34, '#e8e8e8', 8, 'center');
    ctx.globalAlpha = 1;
  }
  // aviso cuando un patrullero te tiene encima
  if(!G.busted && !P.dead && P.car){
    const near = G.cars.some(c => c.chase && c.hp > 0 && dist(c,P) < 30);
    if(near && Math.floor(G.t*5)%2)
      text('FRENA Y TE AGARRAN - ACELERA!', RW/2, 52, '#ff8a4a', 8, 'center');
  }
  if(P.dead){
    ctx.fillStyle = 'rgba(70,0,0,.55)'; ctx.fillRect(0,0,RW,RH);
    text('TE MATARON', RW/2, RH/2-10, '#ff4a4a', 16, 'center');
    text('GUITA: $'+G.money, RW/2, RH/2+12, '#ffd34a', 9, 'center');
    text('ENTER PARA VOLVER AL BARRIO', RW/2, RH/2+32, '#fff', 8, 'center');
  }
  if(G.paused){
    ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(0,0,RW,RH);
    text('PAUSA', RW/2, RH/2, '#ffd34a', 16, 'center');
  }
}

function render(){
  const night = darkness(), P = G.player;
  litWindows.length = 0;
  ctx.save();
  if(G.shake > .1){
    const a = Math.random()*TAU, m = Math.min(G.shake, 6);
    ctx.translate(px(Math.cos(a)*m), px(Math.sin(a)*m));
  }
  drawGround();

  for(const pk of G.pickups){                                  // items
    const x = pk.x-G.cam.x, y = pk.y-G.cam.y + Math.sin(pk.t*3)*2;
    if(x<-12||y<-12||x>RW+12||y>RH+12) continue;
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(px(x-4), px(pk.y-G.cam.y+4), 9, 3);
    if(pk.kind === 'cash'){
      ctx.fillStyle = '#1f5c23'; ctx.fillRect(px(x-5), px(y-4), 10, 7);
      ctx.fillStyle = '#3f9c43'; ctx.fillRect(px(x-5), px(y-4), 10, 3);
      ctx.fillStyle = '#d8f0d8'; ctx.fillRect(px(x-2), px(y-2), 4, 3);
    } else {
      ctx.fillStyle = '#e8e8e8'; ctx.fillRect(px(x-5), px(y-4), 10, 8);
      ctx.fillStyle = '#c8302a'; ctx.fillRect(px(x-1.5), px(y-3), 3, 6); ctx.fillRect(px(x-4), px(y-.5), 8, 3);
    }
  }
  for(const c of G.cars) if(c !== (P && P.car)) drawCar(c, night);
  for(const p of G.peds){
    if(p.hp <= 0 || p.inside) continue;
    if(p.fade < 1) ctx.globalAlpha = p.fade;        // aparece/desaparece en la puerta
    drawGuy(p, p.face, p.shirt, p.pants, false);
    ctx.globalAlpha = 1;
  }
  for(const c of G.cops) drawGuy(c, 'cop', '#20406f', '#14213d', false);

  // edificios: los mas lejanos del centro primero para que ocluyan bien
  const vis = [];
  for(const b of buildings){
    const x = b.x-G.cam.x, y = b.y-G.cam.y;
    if(x > RW+60 || y > RH+60 || x+b.w < -60 || y+b.h < -60) continue;
    vis.push(b);
  }
  vis.sort((a,b2) => (Math.hypot(b2.x+b2.w/2-G.cam.x-RW/2, b2.y+b2.h/2-G.cam.y-RH/2))
                   - (Math.hypot(a.x+a.w/2-G.cam.x-RW/2,  a.y+a.h/2-G.cam.y-RH/2)));
  for(const b of vis) drawBuilding(b, night);
  for(const p of props) if(p.t === 'palm') drawPalm(p);
  for(const l of lamps) drawLamp(l, night);
  for(const L of lights) drawTrafficLight(L);

  if(P){                                                       // jugador siempre visible
    if(P.car) drawCar(P.car, night);
    else if(!P.dead) drawGuy(P, P.def.id, P.def.shirt, P.def.pants, P.hp < 35);
  }
  for(const b of G.bullets){
    ctx.strokeStyle = b.mine ? 'rgba(255,235,160,.95)' : 'rgba(255,150,110,.95)';
    ctx.lineWidth = 1.6; ctx.beginPath();
    ctx.moveTo(b.x-G.cam.x, b.y-G.cam.y);
    ctx.lineTo(b.x-G.cam.x - b.vx*.012, b.y-G.cam.y - b.vy*.012); ctx.stroke();
  }
  for(const f of G.fx){
    ctx.globalAlpha = clamp(f.life/f.max, 0, 1);
    ctx.fillStyle = 'rgb('+f.col+')';
    ctx.fillRect(px(f.x-G.cam.x), px(f.y-G.cam.y), f.sz, f.sz);
  }
  for(const s of G.smoke){
    ctx.globalAlpha = clamp(s.life/s.max, 0, 1)*.45;
    ctx.fillStyle = 'rgb('+s.col+')';
    ctx.beginPath(); ctx.arc(s.x-G.cam.x, s.y-G.cam.y, s.r, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  drawLights(night);
  ctx.restore();

  ctx.drawImage(VIG, 0, 0);
  if(G.flash > 0){ ctx.globalAlpha = G.flash*.5; ctx.fillStyle = '#ffdca0';
                   ctx.fillRect(0,0,RW,RH); ctx.globalAlpha = 1; }
  drawRadar();
  drawHUD();
}

// ------------------------------------------------------------------ loop
let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now-last)/1000); last = now;
  if(G.state === 'play'){
    if(keys.KeyP && !G._p){ G.paused = !G.paused; G._p = true; }
    if(!keys.KeyP) G._p = false;
    if(!G.paused) update(dt);
    render();
  }
  requestAnimationFrame(frame);
}

// ------------------------------------------------------- pantallas (DOM)
const $ = id => document.getElementById(id);
const show = id => document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
function fadeTo(fn){ const f = $('fade'); f.style.opacity = 1;
                     setTimeout(() => { fn(); f.style.opacity = 0; }, 360); }
let selIdx = 0;
function buildCards(){
  $('cards').innerHTML = CREW.map((c,i) =>
    '<div class="card'+(i===0?' sel':'')+'" data-i="'+i+'"><img src="'+c.img+'" alt="">'+
    '<div class="nm">'+c.name+'</div></div>').join('');
  $('cards').querySelectorAll('.card').forEach(el => {
    el.onclick = () => { selIdx = +el.dataset.i; markSel(); play(); }; });
}
const markSel = () => $('cards').querySelectorAll('.card').forEach((el,i) => el.classList.toggle('sel', i===selIdx));
function play(){ fadeTo(() => { show(''); startGame(CREW[selIdx]); }); }

addEventListener('keydown', e => {
  if(G.state === 'menu' && (e.code === 'Enter' || e.code === 'Space')){
    G.state = 'sel'; fadeTo(() => show('sel'));
  } else if(G.state === 'sel'){
    if(e.code === 'ArrowRight'||e.code === 'KeyD'){ selIdx = (selIdx+1)%CREW.length; markSel(); }
    if(e.code === 'ArrowLeft' ||e.code === 'KeyA'){ selIdx = (selIdx-1+CREW.length)%CREW.length; markSel(); }
    if(e.code === 'Enter'||e.code === 'Space') play();
  }
});
$('btnPlay').onclick = () => { G.state = 'sel'; fadeTo(() => show('sel')); };

// caras: recorta la foto y la baja a 14x14 => pixel art de la cara real
function pixelFace(img, crop, size){
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'); g.imageSmoothingEnabled = true;
  g.drawImage(img, crop[0]*img.width, crop[1]*img.height, crop[2]*img.width, crop[3]*img.height, 0, 0, size, size);
  const d = g.getImageData(0,0,size,size), p = d.data;
  for(let i=0;i<p.length;i+=4)
    for(let k=0;k<3;k++) p[i+k] = clamp((p[i+k]-128)*1.22 + 138, 0, 255);
  g.putImageData(d,0,0);
  // contorno oscuro para que la cabeza se despegue del fondo
  const o = document.createElement('canvas'); o.width = o.height = size;
  const og = o.getContext('2d');
  og.drawImage(c,0,0); og.globalCompositeOperation = 'destination-over';
  og.fillStyle = '#14100c'; og.fillRect(0,0,size,size);
  return o;
}

const IMGS = {};
function loadAll(list, onProg){
  let done = 0;
  return Promise.all(list.map(src => new Promise(res => {
    const im = new Image();
    im.onload = im.onerror = () => { IMGS[src] = im; onProg(++done/list.length); res(); };
    im.src = src;
  })));
}

(async function boot(){
  let tip = 0; $('tip').textContent = TIPS[0];
  const timer = setInterval(() => { tip = (tip+1)%TIPS.length; $('tip').textContent = TIPS[tip]; }, 2400);

  const t0 = performance.now();
  buildCity();
  bakeGround();
  await loadAll(CREW.map(c=>c.img).concat(['img/crew.jpeg','img/loading.jpeg']),
                p => $('fill').style.width = Math.round(p*100)+'%');

  for(const c of CREW) if(IMGS[c.img] && IMGS[c.img].width) G.faces[c.id] = pixelFace(IMGS[c.img], c.crop, 14);
  // caras genericas para los peatones anonimos
  const SKIN = ['#c9a07a','#a9784f','#e0b892','#8a5f3c'];
  const HAIR = ['#2a1d12','#4a3a22','#6b4a2a','#1a1a1a','#8a6a3a'];
  for(let i=0;i<4;i++){
    const c2 = document.createElement('canvas'); c2.width = c2.height = 14;
    const g2 = c2.getContext('2d');
    g2.fillStyle = '#14100c'; g2.fillRect(0,0,14,14);
    g2.fillStyle = SKIN[i]; g2.fillRect(2,4,10,9);
    g2.fillStyle = HAIR[i % HAIR.length]; g2.fillRect(2,2,10,4);
    g2.fillStyle = '#1a1a1a'; g2.fillRect(4,7,2,2); g2.fillRect(8,7,2,2);
    g2.fillStyle = 'rgba(0,0,0,.25)'; g2.fillRect(5,11,4,1);
    G.faces['ped'+i] = c2;
  }
  G.faces.ped = G.faces.ped0;

  const cop = document.createElement('canvas'); cop.width = cop.height = 12;
  const cg = cop.getContext('2d');
  cg.fillStyle = '#14100c'; cg.fillRect(0,0,12,12);
  cg.fillStyle = '#c9a07a'; cg.fillRect(2,3,8,8);
  cg.fillStyle = '#1b2a4a'; cg.fillRect(1,1,10,3);
  cg.fillStyle = '#0b0b0b'; cg.fillRect(2,5,8,2);
  cg.fillStyle = '#d8d8d8'; cg.fillRect(4,2,4,1);
  G.faces.cop = cop;

  const skip = location.search.indexOf('play') >= 0;   // ?play=1 entra directo (para probar)
  setTimeout(() => {
    clearInterval(timer);
    buildCards();
    if(skip){ show(''); startGame(CREW[0]);
      const q = new URLSearchParams(location.search);
      const h = parseFloat(q.get('h'));
      if(!isNaN(h)) G.t = ((h/24 - 0.34 + 1) % 1) * DAY;   // ?h=21 para probar de noche
      const w = parseInt(q.get('w'));                      // ?w=4 para probar la yuta
      if(!isNaN(w)) G.wanted = clamp(w, 0, 5);
      if(q.get('bust')){ G.money = 4200; setTimeout(() => bust(), 400); }   // ?bust=1
    }
    else { G.state = 'menu'; fadeTo(() => show('menu')); }
    requestAnimationFrame(frame);
  }, skip ? 0 : Math.max(0, 2600 - (performance.now()-t0)));
})();
</script>
