<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>GTA MERCALOCA</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ --gold:#e8b53a; --grove:#3a9b47; --ink:#08080a; }
  *{box-sizing:border-box;margin:0;padding:0;touch-action:none;-webkit-touch-callout:none}
  html,body{height:100%;background:var(--ink);overflow:hidden;font-family:"Press Start 2P",monospace;color:#fff;user-select:none;-webkit-user-select:none}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  canvas{image-rendering:pixelated;background:#000;max-width:100vw;max-height:100vh;
         box-shadow:0 0 0 2px #000, 0 12px 60px rgba(0,0,0,.9)}
  .screen{position:fixed;inset:0;display:none;place-items:center;background:#000}
  .screen.on{display:grid}
  .bg{position:absolute;inset:0;background-size:cover;background-position:center}
  .vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,.9) 100%)}
  .scan{position:absolute;inset:0;pointer-events:none;
        background:repeating-linear-gradient(to bottom,rgba(0,0,0,.20) 0 1px,transparent 1px 3px)}

  #load .bar{position:absolute;right:4vw;bottom:6vh;width:42vw;height:16px;border:3px solid #fff;background:#000;padding:2px}
  #load .fill{height:100%;width:0%;background:linear-gradient(90deg,#e8b53a,#fff);transition:width .25s}
  #load .tip{position:absolute;right:4vw;bottom:calc(6vh + 34px);width:54vw;text-align:right;font-size:11px;line-height:1.9;text-shadow:2px 2px 0 #000}
  #load .logo{position:absolute;left:4vw;bottom:6vh;font-size:min(7vw,52px);line-height:1.15;text-shadow:5px 5px 0 #000;letter-spacing:2px}
  #load .logo b{display:block;color:var(--gold);text-shadow:5px 5px 0 #000,0 0 26px rgba(232,181,58,.55)}

  #menu .panel{position:relative;text-align:center;padding:24px}
  #menu h1{font-size:min(9.5vw,68px);color:var(--gold);letter-spacing:4px;
           text-shadow:6px 6px 0 #000,0 0 40px rgba(232,181,58,.45)}
  #menu h2{font-size:min(2.6vw,15px);margin-top:12px;color:#ddd;text-shadow:3px 3px 0 #000}
  #menu .mi{margin-top:30px;font-size:15px;color:#eee;text-shadow:3px 3px 0 #000;cursor:pointer;transition:.1s}
  #menu .mi:hover,#menu .mi.sel{color:var(--grove);transform:scale(1.06)}
  #menu .hint{margin-top:28px;font-size:9px;color:#8e8e8e;line-height:2.2}

  #sel .grid{position:relative;display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:94vw}
  #sel .card{width:152px;border:3px solid #2a2a2a;background:#101010;cursor:pointer;transition:.13s;
             box-shadow:0 8px 20px rgba(0,0,0,.7)}
  #sel .card img{width:100%;height:176px;object-fit:cover;object-position:center top;display:block;filter:saturate(1.1)}
  #sel .card .nm{font-size:9px;padding:9px 4px;text-align:center;letter-spacing:1px}
  #sel .card:hover,#sel .card.sel{border-color:var(--gold);transform:translateY(-8px);
             box-shadow:0 14px 28px rgba(0,0,0,.8),0 0 24px rgba(232,181,58,.35)}
  #sel .card.sel .nm{color:var(--gold)}
  #sel h3{position:absolute;top:6vh;font-size:min(4vw,24px);color:var(--gold);text-shadow:4px 4px 0 #000;letter-spacing:3px}
  #sel .go{margin-top:14px;font-size:10px;color:#bbb;letter-spacing:1px;text-align:center}
  #sel .btn-play-sel{margin-top:14px;font-size:14px;color:var(--gold);border:2px solid var(--gold);padding:10px 24px;background:rgba(0,0,0,0.6);cursor:pointer;transition:transform 0.1s}
  #sel .btn-play-sel:active{transform:scale(0.95);background:var(--gold);color:#000}
  .fade{position:fixed;inset:0;background:#000;pointer-events:none;opacity:0;transition:opacity .35s;z-index:50}

  /* Controles Táctiles (Mobile) */
  #touch-controls {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 45;
    display: none;
  }
  #touch-controls.active {
    display: block;
  }
  .touch-zone {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 48vw;
    height: 52vh;
    pointer-events: auto;
    touch-action: none;
  }
  .stick-base {
    position: absolute;
    width: 100px;
    height: 100px;
    border-radius: 50%;
    border: 3px solid rgba(232, 181, 58, 0.65);
    background: radial-gradient(circle, rgba(232, 181, 58, 0.18) 0%, rgba(0, 0, 0, 0.65) 85%);
    box-shadow: 0 0 16px rgba(0, 0, 0, 0.8), inset 0 0 12px rgba(232, 181, 58, 0.3);
    left: 80px;
    bottom: 80px;
    transform: translate(-50%, -50%);
    pointer-events: none;
    opacity: 0.85;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .stick-base.moving {
    border-color: var(--gold);
    box-shadow: 0 0 24px rgba(232, 181, 58, 0.5), inset 0 0 15px rgba(232, 181, 58, 0.4);
  }
  .stick-ring {
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 1px dashed rgba(232, 181, 58, 0.35);
  }
  .stick-thumb {
    position: absolute;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff 0%, var(--gold) 45%, #7a560c 100%);
    box-shadow: 0 4px 10px rgba(0,0,0,0.85), 0 0 10px rgba(232,181,58,0.6);
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }
  .touch-actions {
    position: absolute;
    right: 4vw;
    bottom: 4vh;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 12px;
    pointer-events: auto;
  }
  .touch-btn-row {
    display: flex;
    gap: 12px;
  }
  .touch-btn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.45);
    background: rgba(18, 18, 22, 0.78);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    color: #fff;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.75);
    transition: transform 0.08s, background-color 0.08s, border-color 0.08s;
  }
  .touch-btn:active, .touch-btn.pressed {
    transform: scale(0.92);
    box-shadow: 0 2px 8px rgba(0,0,0,0.9);
  }
  .btn-fire {
    width: 76px;
    height: 76px;
    font-size: 32px;
    border-color: #d1483f;
    background: radial-gradient(circle, rgba(209, 72, 63, 0.65) 0%, rgba(20, 10, 10, 0.85) 80%);
    box-shadow: 0 0 16px rgba(209, 72, 63, 0.5);
  }
  .btn-fire:active, .btn-fire.pressed {
    background: radial-gradient(circle, rgba(255, 90, 80, 0.85) 0%, rgba(120, 20, 20, 0.95) 80%);
    border-color: #ff6a5a;
  }
  .btn-car {
    border-color: #3f8ad8;
    background: radial-gradient(circle, rgba(63, 138, 216, 0.5) 0%, rgba(10, 20, 30, 0.85) 80%);
  }
  .btn-car:active, .btn-car.pressed {
    border-color: #72b0f4;
  }
  .btn-run {
    border-color: var(--grove);
    background: radial-gradient(circle, rgba(58, 155, 71, 0.5) 0%, rgba(10, 30, 15, 0.85) 80%);
  }
  .btn-run:active, .btn-run.pressed {
    border-color: #5ed66e;
  }
  .btn-pause {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 40px;
    height: 40px;
    font-size: 16px;
    border-radius: 8px;
    border-color: #666;
    background: rgba(10, 10, 10, 0.68);
    pointer-events: auto;
  }
  .touch-toggle-btn {
    position: fixed;
    top: 14px;
    left: 14px;
    width: 38px;
    height: 38px;
    font-size: 18px;
    border-radius: 8px;
    border: 2px solid rgba(232, 181, 58, 0.6);
    background: rgba(10, 10, 10, 0.7);
    color: #fff;
    cursor: pointer;
    z-index: 60;
    pointer-events: auto;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<div class="screen on" id="load">
  <div class="bg" style="background-image:url('img/loading.jpeg')"></div>
  <div class="vig"></div><div class="scan"></div>
  <div class="logo">GRAND THEFT<b>MERCALOCA</b></div>
  <div class="tip" id="tip"></div>
  <div class="bar"><div class="fill" id="fill"></div></div>
</div>

<div class="screen" id="menu">
  <div class="bg" style="background-image:url('img/crew.jpeg')"></div>
  <div class="vig"></div><div class="scan"></div>
  <div class="panel">
    <h1>MERCALOCA</h1>
    <h2>SAN ANDREAS &mdash; GROVE ST. 4 LIFE</h2>
    <div class="mi sel" id="btnPlay">&gt; EMPEZAR PARTIDA</div>
    <div class="hint">WASD / FLECHAS mover &nbsp;&middot;&nbsp; ESPACIO disparar &nbsp;&middot;&nbsp; E auto<br>
      SHIFT correr &nbsp;&middot;&nbsp; P pausa<br>si te frenan con la yuta encima, vas preso</div>
  </div>
</div>

<div class="screen" id="sel">
  <div class="bg" style="background-image:url('img/crew.jpeg');filter:blur(7px) brightness(.3)"></div>
  <h3>ELEGI TU PERSONAJE</h3>
  <div class="grid" id="cards"></div>
  <div class="go">Toca tu personaje para jugar &middot; o dale a JUGAR</div>
  <div class="btn-play-sel" id="btnPlaySel">&gt; JUGAR AHORA &lt;</div>
</div>
<div class="fade" id="fade"></div>

<!-- Botón de control táctil siempre accesible -->
<button id="btn-toggle-touch" class="touch-toggle-btn" aria-label="Controles táctiles" title="Activar/Desactivar controles táctiles">🕹️</button>

<!-- Controles Táctiles en Pantalla -->
<div id="touch-controls">
  <div id="touch-zone-stick" class="touch-zone">
    <div id="stick-base" class="stick-base">
      <div class="stick-ring"></div>
      <div id="stick-thumb" class="stick-thumb"></div>
    </div>
  </div>
  <div id="touch-actions" class="touch-actions">
    <button id="btn-fire" class="touch-btn btn-fire" aria-label="Disparar">🔫</button>
    <div class="touch-btn-row">
      <button id="btn-car" class="touch-btn btn-car" aria-label="Auto">🚗</button>
      <button id="btn-run" class="touch-btn btn-run" aria-label="Correr">⚡</button>
    </div>
  </div>
  <button id="btn-pause" class="touch-btn btn-pause" aria-label="Pausa">⏸</button>
</div>

<!-- Módulos de lógica y motor del juego con cache busting -->
<script src="js/constants.js?v=3"></script>
<script src="js/utils.js?v=3"></script>
<script src="js/input.js?v=3"></script>
<script src="js/world.js?v=3"></script>
<script src="js/entities.js?v=3"></script>
<script src="js/game.js?v=3"></script>
<script src="js/renderer.js?v=3"></script>
<script src="js/ui.js?v=3"></script>
<script src="js/touch.js?v=3"></script>
<script src="js/main.js?v=3"></script>
</body>
</html>
